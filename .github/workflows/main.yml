name: Analisar contador do jogo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar pagina do jogo
        shell: bash
        run: |
          curl -L --max-time 60 -s \
            "https://cargadutra.netlify.app/" \
            -o /tmp/index.html

          echo "Pagina baixada."
          wc -c /tmp/index.html

      - name: Decodificar JavaScript do jogo
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse

          html = open(
              "/tmp/index.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          print("")
          print("========================================")
          print("SCRIPTS ENCONTRADOS")
          print("========================================")
          print("Quantidade:", len(scripts))

          game_js = None

          for i, src in enumerate(scripts):
              print(f"[{i}] {src[:120]}")

              if src.startswith("data:text/javascript"):
                  game_js = src
                  break

          if not game_js:
              print("")
              print("[ERRO] Nenhum script data:text/javascript encontrado.")
              open("/tmp/game.js", "w").write("")
              raise SystemExit(0)

          print("")
          print("Script do jogo encontrado.")

          try:
              header, data = game_js.split(",", 1)
          except ValueError:
              print("[ERRO] Formato data URL inesperado.")
              open("/tmp/game.js", "w").write("")
              raise SystemExit(0)

          data = urllib.parse.unquote(data)

          if ";base64" in header.lower():
              try:
                  decoded = base64.b64decode(data).decode(
                      "utf-8",
                      errors="ignore"
                  )
              except Exception as e:
                  print("[ERRO] Falha ao decodificar Base64:", e)
                  open("/tmp/game.js", "w").write("")
                  raise SystemExit(0)
          else:
              decoded = data

          open(
              "/tmp/game.js",
              "w",
              encoding="utf-8"
          ).write(decoded)

          print("")
          print("JavaScript decodificado com sucesso.")
          print("Tamanho:", len(decoded), "caracteres")
          PY

      - name: Procurar codigo do contador
        shell: bash
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("ANALISE DO CONTADOR")
          print("========================================")
          print("")

          termos = [
              "elapsed",
              "targetTime",
              "formatTime",
              "timer",
              "countdown",
              "remaining",
              "timeLeft",
              "timeRemaining",
              "duration",
              "seconds",
              "setInterval",
              "setTimeout",
              "Date.now",
              "performance.now",
              "requestAnimationFrame",
              "tempo",
              "fase",
              "phase",
              "innerText",
              "textContent",
              "99999",
              "9999999",
              "60000",
              "30000"
          ]

          encontrados = []

          js_lower = js.lower()

          for termo in termos:
              pos = 0

              while True:
                  pos = js_lower.find(termo.lower(), pos)

                  if pos == -1:
                      break

                  encontrados.append((pos, termo))
                  pos += len(termo)

          encontrados.sort()

          print("Ocorrencias encontradas:", len(encontrados))
          print("")

          if not encontrados:
              print("[?] Nenhum termo relacionado ao contador foi encontrado.")
              print("")
              print("Pode ser que o nome das variaveis seja diferente.")
              raise SystemExit(0)

          usados = set()
          contador = 0

          for pos, termo in encontrados:

              # Evita mostrar varias vezes praticamente o mesmo trecho
              bloco = pos // 600

              if bloco in usados:
                  continue

              usados.add(bloco)

              inicio = max(0, pos - 350)
              fim = min(len(js), pos + 650)

              trecho = js[inicio:fim]

              # Quebra um pouco o JavaScript para facilitar a leitura
              trecho = re.sub(
                  r'[{}]',
                  lambda m: m.group(0) + "\n",
                  trecho
              )

              trecho = re.sub(
                  r';',
                  ';\n',
                  trecho
              )

              print("----------------------------------------")
              print("TERMO ENCONTRADO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")
              print(trecho[:1400])
              print("")

              contador += 1

              if contador >= 20:
                  break

          print("========================================")
          print("FIM DA ANALISE")
          print("========================================")
          print("")
          print("Foram mostrados no maximo 20 trechos relevantes.")
          PY

      - name: Procurar elementos de interface relacionados ao tempo
        shell: bash
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("ELEMENTOS DA INTERFACE")
          print("========================================")

          padroes = [
              r'getElementById\([^)]*\)',
              r'querySelector\([^)]*\)',
              r'querySelectorAll\([^)]*\)',
              r'innerText\s*=',
              r'textContent\s*=',
              r'innerHTML\s*=',
              r'createElement\([^)]*\)'
          ]

          achados = []

          for padrao in padroes:
              for m in re.finditer(padrao, js, re.I):
                  trecho = js[
                      max(0, m.start() - 180):
                      min(len(js), m.end() + 300)
                  ]

                  baixo = trecho.lower()

                  if any(
                      x in baixo
                      for x in [
                          "timer",
                          "tempo",
                          "time",
                          "fase",
                          "phase",
                          "second",
                          "countdown",
                          "remaining"
                      ]
                  ):
                      achados.append(trecho)

          vistos = set()
          contador = 0

          for trecho in achados:
              chave = trecho[:250]

              if chave in vistos:
                  continue

              vistos.add(chave)

              print("")
              print("----------------------------------------")
              print(trecho[:700])
              print("----------------------------------------")

              contador += 1

              if contador >= 15:
                  break

          if contador == 0:
              print("")
              print("[?] Nenhum elemento de interface claramente relacionado ao tempo foi encontrado.")

          print("")
          print("========================================")
          print("ANALISE CONCLUIDA")
          print("========================================")
          PY
