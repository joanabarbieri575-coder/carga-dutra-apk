name: Localizar timer da partida

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar jogo
        run: |
          curl -L --max-time 60 -s \
            "https://cargadutra.netlify.app/" \
            -o /tmp/index.html

      - name: Decodificar JavaScript
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse

          html = open(
              "/tmp/index.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          script = None

          for src in scripts:
              if src.startswith("data:text/javascript"):
                  script = src
                  break

          if not script:
              print("ERRO: script nao encontrado.")
              raise SystemExit(0)

          header, data = script.split(",", 1)
          data = urllib.parse.unquote(data)

          if ";base64" in header.lower():
              js = base64.b64decode(data).decode(
                  "utf-8",
                  errors="ignore"
              )
          else:
              js = data

          open(
              "/tmp/game.js",
              "w",
              encoding="utf-8"
          ).write(js)

          print("JavaScript decodificado.")
          print("Tamanho:", len(js), "caracteres")
          PY

      - name: Procurar escrita do HUD Timer
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("ESCRITAS NO HUD TIMER")
          print("========================================")

          padroes = [
              r'hudTimer\s*\.',
              r'ui\s*\.\s*hudTimer\s*\.',
              r'\[\s*["\']hudTimer["\']\s*\]',
              r'["\']#hudTimer["\']',
              r'hudTimer\s*='
          ]

          encontrados = []

          for padrao in padroes:
              for m in re.finditer(padrao, js, re.I):
                  encontrados.append(
                      (m.start(), m.group(0))
                  )

          encontrados.sort()

          vistos = set()
          total = 0

          for pos, termo in encontrados:

              inicio = max(0, pos - 1200)
              fim = min(len(js), pos + 1800)

              trecho = js[inicio:fim]

              # Limita o tamanho mesmo se o JS estiver minificado
              trecho = re.sub(r'\s+', ' ', trecho)
              trecho = trecho.replace(';', ';\n')
              trecho = trecho.replace('{', '{\n')
              trecho = trecho.replace('}', '}\n')

              chave = trecho[:700]

              if chave in vistos:
                  continue

              vistos.add(chave)

              print("")
              print("----------------------------------------")
              print("TERMO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")
              print(trecho[:3200])

              total += 1

              if total >= 20:
                  break

          print("")
          print("Total:", total)
          PY

      - name: Procurar loop da partida
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("LOOP DA PARTIDA E TEMPO")
          print("========================================")

          termos = [
              "requestAnimationFrame",
              "simulator.update",
              "simulator.step",
              "elapsed",
              "deltaTime",
              "delta",
              "dt",
              "Date.now()",
              "performance.now()",
              "setInterval",
              "startTime",
              "startTimestamp",
              "levelStart",
              "levelStarted"
          ]

          encontrados = []

          for termo in termos:
              inicio = 0

              while True:
                  pos = js.lower().find(termo.lower(), inicio)

                  if pos == -1:
                      break

                  encontrados.append(
                      (pos, termo)
                  )

                  inicio = pos + len(termo)

          encontrados.sort()

          vistos = set()
          total = 0

          for pos, termo in encontrados:

              inicio = max(0, pos - 900)
              fim = min(len(js), pos + 1500)

              trecho = js[inicio:fim]

              baixo = trecho.lower()

              # Priorizamos trechos que também tenham relação
              # com partida, HUD ou tempo.
              importantes = [
                  "hudtimer",
                  "elapsed",
                  "timer",
                  "simulator",
                  "level",
                  "time",
                  "seconds",
                  "delta"
              ]

              if not any(x in baixo for x in importantes):
                  continue

              trecho = re.sub(r'\s+', ' ', trecho)
              trecho = trecho.replace(';', ';\n')
              trecho = trecho.replace('{', '{\n')
              trecho = trecho.replace('}', '}\n')

              chave = trecho[:600]

              if chave in vistos:
                  continue

              vistos.add(chave)

              print("")
              print("----------------------------------------")
              print("TERMO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")
              print(trecho[:2800])

              total += 1

              if total >= 30:
                  break

          print("")
          print("Trechos mostrados:", total)
          PY

      - name: Procurar classes de simulacao
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("SIMULATOR")
          print("========================================")

          padroes = [
              r'class\s+\w*[Ss]imulator\w*',
              r'new\s+\w*[Ss]imulator\w*',
              r'simulator\s*=\s*new',
              r'simulator\s*=\s*null'
          ]

          vistos = set()
          total = 0

          for padrao in padroes:

              for m in re.finditer(padrao, js):

                  pos = m.start()

                  inicio = max(0, pos - 800)
                  fim = min(len(js), pos + 1800)

                  trecho = js[inicio:fim]

                  trecho = re.sub(r'\s+', ' ', trecho)
                  trecho = trecho.replace(';', ';\n')
                  trecho = trecho.replace('{', '{\n')
                  trecho = trecho.replace('}', '}\n')

                  chave = trecho[:500]

                  if chave in vistos:
                      continue

                  vistos.add(chave)

                  print("")
                  print("----------------------------------------")
                  print("TERMO:", m.group(0))
                  print("POSICAO:", pos)
                  print("----------------------------------------")
                  print(trecho[:3000])

                  total += 1

                  if total >= 20:
                      break

          print("")
          print("Trechos encontrados:", total)
          PY

      - name: Final
        run: |
          echo ""
          echo "========================================"
          echo "ANALISE CONCLUIDA"
          echo "========================================"
          echo ""
          echo "O jogo ainda nao foi alterado."
          echo "Agora temos que identificar a variavel"
          echo "que alimenta o contador durante a partida."
