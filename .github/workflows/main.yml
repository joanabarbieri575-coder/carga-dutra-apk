name: Encontrar calculo exato do timer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar jogo
        run: |
          curl -L --max-time 60 -s \
            "https://cargadutra.netlify.app/" \
            -o /tmp/index.html

      - name: Decodificar JavaScript
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse

          html = open(
              "/tmp/index.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          script = None

          for src in scripts:
              if src.startswith("data:text/javascript"):
                  script = src
                  break

          if not script:
              print("ERRO: script do jogo nao encontrado.")
              open("/tmp/game.js", "w").write("")
              raise SystemExit(0)

          header, data = script.split(",", 1)

          data = urllib.parse.unquote(data)

          if ";base64" in header.lower():
              js = base64.b64decode(data).decode(
                  "utf-8",
                  errors="ignore"
              )
          else:
              js = data

          open(
              "/tmp/game.js",
              "w",
              encoding="utf-8"
          ).write(js)

          print("JavaScript decodificado.")
          print("Tamanho:", len(js), "caracteres")
          PY

      - name: Localizar hudTimer
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("REFERENCIAS AO HUD TIMER")
          print("========================================")

          padroes = [
              r'ui\.hudTimer',
              r'hudTimer',
              r'formatTime\(',
              r'innerText\s*=',
              r'textContent\s*='
          ]

          encontrados = []

          for padrao in padroes:
              for m in re.finditer(padrao, js, re.I):
                  encontrados.append(
                      (m.start(), m.group(0))
                  )

          encontrados.sort()

          vistos = set()
          total = 0

          for pos, termo in encontrados:

              inicio = max(0, pos - 700)
              fim = min(len(js), pos + 1000)

              trecho = js[inicio:fim]

              # Evita trechos duplicados
              chave = trecho[:300]

              if chave in vistos:
                  continue

              vistos.add(chave)

              print("")
              print("----------------------------------------")
              print("TERMO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")

              # Quebra o codigo para facilitar a leitura
              trecho = re.sub(r'[{}]', r'\g<0>\n', trecho)
              trecho = re.sub(r';', ';\n', trecho)

              print(trecho[:1800])

              total += 1

              if total >= 30:
                  break

          print("")
          print("Total de trechos mostrados:", total)
          PY

      - name: Procurar variaveis de tempo
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("VARIAVEIS E CALCULOS DE TEMPO")
          print("========================================")

          padroes = [
              r'\btime\b',
              r'\btimer\b',
              r'\belapsed\b',
              r'\bremaining\b',
              r'\btimeLeft\b',
              r'\btimeRemaining\b',
              r'\bstartTime\b',
              r'\bendTime\b',
              r'\bstartTimestamp\b',
              r'\bDate\.now',
              r'\bperformance\.now',
              r'\bsetInterval',
              r'\brequestAnimationFrame'
          ]

          resultados = []

          for padrao in padroes:
              for m in re.finditer(padrao, js, re.I):
                  resultados.append(
                      (m.start(), m.group(0))
                  )

          resultados.sort()

          usados = set()
          total = 0

          for pos, termo in resultados:

              inicio = max(0, pos - 450)
              fim = min(len(js), pos + 700)

              trecho = js[inicio:fim]

              # Mostra somente trechos que parecem realmente
              # relacionados ao tempo da partida
              baixo = trecho.lower()

              palavras = [
                  "hudtimer",
                  "formattime",
                  "elapsed",
                  "remaining",
                  "starttime",
                  "endtime",
                  "setinterval",
                  "requestanimationframe",
                  "seconds"
              ]

              if not any(p in baixo for p in palavras):
                  continue

              chave = trecho[:250]

              if chave in usados:
                  continue

              usados.add(chave)

              print("")
              print("----------------------------------------")
              print("TERMO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")

              trecho = re.sub(r'[{}]', r'\g<0>\n', trecho)
              trecho = re.sub(r';', ';\n', trecho)

              print(trecho[:1600])

              total += 1

              if total >= 25:
                  break

          print("")
          print("Trechos de calculo mostrados:", total)
          PY

      - name: Final
        run: |
          echo ""
          echo "========================================"
          echo "ANALISE TERMINADA"
          echo "========================================"
          echo ""
          echo "O jogo nao foi alterado."
          echo "Agora precisamos identificar a variavel"
          echo "que controla o tempo durante a partida."
