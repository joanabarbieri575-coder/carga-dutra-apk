name: Diagnostico do jogo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar ambiente
        run: |
          echo "========================================"
          echo "INICIANDO DIAGNOSTICO"
          echo "========================================"
          echo ""
          echo "Arquivos do projeto:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            -print | sort | head -300

      - name: Procurar elapsed
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "PROCURANDO: elapsed"
          echo "========================================"

          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='package-lock.json' \
            --exclude='yarn.lock' \
            --exclude='pnpm-lock.yaml' \
            "elapsed" . > /tmp/elapsed.txt 2>/dev/null; then

            echo "Encontrado:"
            cat /tmp/elapsed.txt | head -100
          else
            echo "Nenhuma ocorrência de 'elapsed' encontrada."
          fi

      - name: Procurar targetTime
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "PROCURANDO: targetTime"
          echo "========================================"

          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='package-lock.json' \
            --exclude='yarn.lock' \
            --exclude='pnpm-lock.yaml' \
            "targetTime" . > /tmp/targetTime.txt 2>/dev/null; then

            echo "Encontrado:"
            cat /tmp/targetTime.txt | head -100
          else
            echo "Nenhuma ocorrência de 'targetTime' encontrada."
          fi

      - name: Procurar formatTime
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "PROCURANDO: formatTime"
          echo "========================================"

          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='package-lock.json' \
            --exclude='yarn.lock' \
            --exclude='pnpm-lock.yaml' \
            "formatTime" . > /tmp/formatTime.txt 2>/dev/null; then

            echo "Encontrado:"
            cat /tmp/formatTime.txt | head -100
          else
            echo "Nenhuma ocorrência de 'formatTime' encontrada."
          fi

      - name: Procurar palavras relacionadas ao contador
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "PROCURANDO TERMOS DO CONTADOR"
          echo "========================================"

          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='package-lock.json' \
            --exclude='yarn.lock' \
            --exclude='pnpm-lock.yaml' \
            "timer|countdown|count|time|tempo|elapsed|targetTime|formatTime" . \
            > /tmp/timer.txt 2>/dev/null || true

          if [ -s /tmp/timer.txt ]; then
            echo "Ocorrências encontradas:"
            cat /tmp/timer.txt | head -200
          else
            echo "Nenhum termo relacionado encontrado."
          fi

      - name: Diagnostico final
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "DIAGNOSTICO CONCLUIDO"
          echo "========================================"
          echo ""
          echo "O workflow chegou ao final sem cancelar"
          echo "porque uma palavra não foi encontrada."
          echo ""
          echo "Agora procure no log pelas seções:"
          echo "  PROCURANDO: elapsed"
          echo "  PROCURANDO: targetTime"
          echo "  PROCURANDO: formatTime"
          echo "  PROCURANDO TERMOS DO CONTADOR"
          echo ""
          echo "========================================"
