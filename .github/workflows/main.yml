name: Descobrir origem do jogo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Analisar index.html
        run: |
          echo "========================================"
          echo "CONTEUDO DO INDEX.HTML"
          echo "========================================"

          cat index.html

      - name: Procurar recursos externos
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "SCRIPTS EXTERNOS"
          echo "========================================"

          grep -niE \
            '<script|src=|iframe|frame|embed|object|import|module' \
            index.html 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "URLS ENCONTRADAS"
          echo "========================================"

          grep -oE \
            'https?://[^"'\'' <>]+' \
            index.html 2>/dev/null \
            | sort -u || true

      - name: Procurar arquivos JavaScript no projeto
        run: |
          echo ""
          echo "========================================"
          echo "ARQUIVOS JS ENCONTRADOS"
          echo "========================================"

          find . -type f \
            \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            -print

      - name: Final
        run: |
          echo ""
          echo "========================================"
          echo "DIAGNOSTICO CONCLUIDO"
          echo "========================================"
