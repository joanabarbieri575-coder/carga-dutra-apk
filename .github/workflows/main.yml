name: Gerar APK 99999

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar jogo original
        run: |
          mkdir -p app/src/main/assets
          curl -L "https://cargadutra.netlify.app/" \
            -o app/src/main/assets/game.html

      - name: Alterar código do jogo
        run: |
          python3 <<'PY'
          import re
          import base64

          arquivo = "app/src/main/assets/game.html"

          with open(arquivo, "r", encoding="utf-8") as f:
              html = f.read()

          # Encontra TODOS os módulos JavaScript data:
          padrao = r'data:text/javascript;charset=utf-8;base64,([A-Za-z0-9+/=]+)'

          encontrados = list(re.finditer(padrao, html))

          print("Módulos encontrados:", len(encontrados))

          if not encontrados:
              raise Exception("Nenhum módulo JavaScript encontrado.")

          alterados = 0

          # Trabalha de trás para frente para não quebrar os índices
          for m in reversed(encontrados):

              try:
                  codigo = base64.b64decode(m.group(1)).decode("utf-8")
              except:
                  continue

              original = codigo

              # CONTADOR REAL DA PARTIDA
              codigo = codigo.replace(
                  "this.state.elapsed += dt;",
                  "this.state.elapsed = 99999;"
              )

              # Outras possíveis formas de incremento
              codigo = codigo.replace(
                  "this.state.elapsed += delta;",
                  "this.state.elapsed = 99999;"
              )

              codigo = codigo.replace(
                  "this.state.elapsed += fixedDt;",
                  "this.state.elapsed = 99999;"
              )

              # Todos os tempos das fases
              codigo = re.sub(
                  r'targetTime\s*:\s*\d+',
                  'targetTime: 99999',
                  codigo
              )

              if codigo != original:

                  novo = base64.b64encode(
                      codigo.encode("utf-8")
                  ).decode("ascii")

                  inicio = m.start(1)
                  fim = m.end(1)

                  html = html[:inicio] + novo + html[fim:]

                  alterados += 1

          print("Módulos alterados:", alterados)

          if alterados == 0:
              raise Exception(
                  "O código do contador não foi encontrado. "
                  "Não vou gerar um APK que não tenha a alteração."
              )

          with open(arquivo, "w", encoding="utf-8") as f:
              f.write(html)

          print("CONTADOR 99999 APLICADO")
          PY

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/cargadutra/apk
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CargaDutra"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cargadutra.apk'
              compileSdk 35

              defaultConfig {
                  applicationId "com.cargadutra.apk"
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Carga Dutra">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Criar aplicativo
        run: |
          cat > app/src/main/java/com/cargadutra/apk/MainActivity.java <<'EOF'
          package com.cargadutra.apk;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.InputStream;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);

                  WebSettings s = web.getSettings();

                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setSupportZoom(false);

                  web.setWebViewClient(new WebViewClient());

                  setContentView(web);

                  try {

                      InputStream input =
                          getAssets().open("game.html");

                      byte[] data =
                          new byte[input.available()];

                      input.read(data);
                      input.close();

                      String html =
                          new String(data, "UTF-8");

                      web.loadDataWithBaseURL(
                          "https://cargadutra.netlify.app/",
                          html,
                          "text/html",
                          "UTF-8",
                          null
                      );

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onBackPressed() {

                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-99999-v2
          path: app/build/outputs/apk/debug/app-debug.apk
