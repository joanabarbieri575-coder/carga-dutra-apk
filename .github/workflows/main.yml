name: Carga Dutra - APK 99999

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR O JOGO ORIGINAL
      # ============================================================
      - name: Baixar jogo original
        run: |
          set -e

          curl -L --fail --max-time 120 \
            "https://cargadutra.netlify.app/" \
            -o original.html

          echo "Jogo original baixado:"
          wc -c original.html


      # ============================================================
      # 2. CONFIGURAR NODE
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ============================================================
      # 3. MODIFICAR O JOGO
      # ============================================================
      - name: Modificar timer sem alterar a estrutura do jogo
        run: |
          set -e

          python3 <<'PY'
          import re
          import base64
          import urllib.parse
          import os

          INPUT = "original.html"
          OUTPUT_DIR = "web"
          OUTPUT = "web/index.html"

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          html = open(
              INPUT,
              "r",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("HTML original:", len(html), "bytes")

          # --------------------------------------------------------
          # Decodifica data:text/javascript
          # --------------------------------------------------------
          def decode_data_url(url):
              header, data = url.split(",", 1)

              data = urllib.parse.unquote(data)

              if ";base64" in header.lower():
                  raw = base64.b64decode(data)
                  return raw.decode(
                      "utf-8",
                      errors="ignore"
                  )

              return data

          # --------------------------------------------------------
          # Codifica novamente como data URL
          # --------------------------------------------------------
          def encode_data_url(js):
              encoded = base64.b64encode(
                  js.encode("utf-8")
              ).decode("ascii")

              return (
                  "data:text/javascript;charset=utf-8;base64,"
                  + encoded
              )

          # --------------------------------------------------------
          # Procura scripts
          # --------------------------------------------------------
          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          data_scripts = [
              s for s in scripts
              if s.lower().startswith(
                  "data:text/javascript"
              )
          ]

          if not data_scripts:
              raise SystemExit(
                  "ERRO: nenhum módulo JavaScript data: encontrado."
              )

          print(
              "Módulos data encontrados:",
              len(data_scripts)
          )

          principal_url = data_scripts[0]

          print("Script principal encontrado.")

          # Cache para não processar duas vezes
          cache = {}

          timer_alterado = False

          # --------------------------------------------------------
          # Importações data:
          #
          # from "data:text/javascript..."
          # import "data:text/javascript..."
          # --------------------------------------------------------
          pattern = re.compile(
              r'(?P<prefix>(?:from|import)\s*[\'"])'
              r'(?P<url>data:text/javascript[^\'"]+)'
              r'(?P<suffix>[\'"])',
              re.I
          )

          def process_module(url, nivel=0):

              global timer_alterado

              if url in cache:
                  return cache[url]

              js = decode_data_url(url)

              print(
                  "  " * nivel +
                  "Módulo:",
                  len(js),
                  "bytes"
              )

              # ----------------------------------------------------
              # Primeiro processa módulos internos
              # ----------------------------------------------------
              def replace_import(match):

                  old_url = match.group("url")

                  new_url = process_module(
                      old_url,
                      nivel + 1
                  )

                  return (
                      match.group("prefix")
                      + new_url
                      + match.group("suffix")
                  )

              js = pattern.sub(
                  replace_import,
                  js
              )

              # ----------------------------------------------------
              # ALTERAÇÃO DO TIMER
              # ----------------------------------------------------
              antigo = "this.state.elapsed += dt;"

              novo = "this.state.elapsed = 99999;"

              if antigo in js:

                  print(
                      "  " * nivel +
                      ">>> TIMER ENCONTRADO"
                  )

                  js = js.replace(
                      antigo,
                      novo,
                      1
                  )

                  timer_alterado = True

                  print(
                      "  " * nivel +
                      ">>> TIMER INTERNO = 99999"
                  )

              # ----------------------------------------------------
              # ALTERAÇÃO VISUAL
              #
              # O jogo original transforma 99999 em 1666:39.
              # Aqui fazemos o HUD mostrar literalmente 99999.
              # ----------------------------------------------------
              antigo_hud = (
                  "ui.hudTimer.textContent = "
                  "formatTime(hud.elapsed);"
              )

              novo_hud = (
                  "ui.hudTimer.textContent = '99999';"
              )

              if antigo_hud in js:

                  js = js.replace(
                      antigo_hud,
                      novo_hud,
                      1
                  )

                  print(
                      "  " * nivel +
                      ">>> HUD = 99999"
                  )

              cache[url] = encode_data_url(js)

              return cache[url]

          # --------------------------------------------------------
          # Processa o módulo principal
          # --------------------------------------------------------
          principal_js = decode_data_url(
              principal_url
          )

          def replace_principal(match):

              old_url = match.group("url")

              new_url = process_module(
                  old_url,
                  1
              )

              return (
                  match.group("prefix")
                  + new_url
                  + match.group("suffix")
              )

          principal_js = pattern.sub(
              replace_principal,
              principal_js
          )

          # --------------------------------------------------------
          # Verifica se o timer foi realmente encontrado
          # --------------------------------------------------------
          if not timer_alterado:
              raise SystemExit(
                  "ERRO: timer não encontrado."
              )

          # --------------------------------------------------------
          # Re-empacota somente o script principal.
          # O restante do HTML original permanece igual.
          # --------------------------------------------------------
          novo_principal = encode_data_url(
              principal_js
          )

          html_final = html.replace(
              principal_url,
              novo_principal,
              1
          )

          if html_final == html:
              raise SystemExit(
                  "ERRO: o HTML não foi alterado."
              )

          # --------------------------------------------------------
          # Garante que NÃO existe iframe no nosso arquivo.
          # --------------------------------------------------------
          if "<iframe" in html_final.lower():
              print(
                  "AVISO: HTML original possui iframe."
              )

          open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ).write(html_final)

          print("")
          print("==========================================")
          print("JOGO MODIFICADO COM SUCESSO")
          print("==========================================")
          print("Timer interno: 99999")
          print("HUD: 99999")
          print("Módulos processados:", len(cache))
          print("HTML final:", len(html_final), "bytes")
          print("Arquivo:", OUTPUT)
          PY


      # ============================================================
      # 4. VERIFICAR O ARQUIVO
      # ============================================================
      - name: Verificar jogo modificado
        run: |
          set -e

          test -f web/index.html

          echo "Arquivo encontrado:"
          ls -lh web/index.html

          echo ""
          echo "Procurando alteração do timer..."

          grep -o "this.state.elapsed = 99999" \
            web/index.html \
            | head -1 \
            || true

          echo ""
          echo "Procurando HUD 99999..."

          grep -o "ui.hudTimer.textContent = '99999'" \
            web/index.html \
            | head -1 \
            || true

          echo ""
          echo "Verificação concluída."


      # ============================================================
      # 5. CRIAR PROJETO CAPACITOR
      # ============================================================
      - name: Instalar Capacitor
        run: |
          set -e

          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android


      # ============================================================
      # 6. INICIALIZAR CAPACITOR
      # ============================================================
      - name: Inicializar Capacitor
        run: |
          set -e

          npx cap init \
            "Carga Dutra" \
            "com.cargadutra.game" \
            --web-dir web


      # ============================================================
      # 7. ADICIONAR ANDROID
      # ============================================================
      - name: Adicionar Android
        run: |
          set -e

          npx cap add android


      # ============================================================
      # 8. COPIAR O JOGO PARA O APK
      # ============================================================
      - name: Copiar jogo para Android
        run: |
          set -e

          npx cap copy android


      # ============================================================
      # 9. JAVA 21
      # ============================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # 10. ANDROID SDK
      # ============================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 11. PERMISSÕES ANDROID
      # ============================================================
      - name: Configurar permissões Android
        run: |
          python3 <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"

          text = open(
              path,
              encoding="utf-8"
          ).read()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if permission not in text:

              text = text.replace(
                  "<manifest",
                  "<manifest\n    " + permission,
                  1
              )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(text)

          print("INTERNET configurado.")
          PY


      # ============================================================
      # 12. CORRIGIR CONFLITO KOTLIN
      # ============================================================
      - name: Corrigir Kotlin
        working-directory: android
        run: |
          python3 <<'PY'
          path = "app/build.gradle"

          text = open(
              path,
              encoding="utf-8"
          ).read()

          bloco = """

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          """

          if "kotlin-stdlib:1.8.22" not in text:
              text += bloco

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(text)

          print("Kotlin configurado.")
          PY


      # ============================================================
      # 13. COMPILAR APK
      # ============================================================
      - name: Compilar APK
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 14. PREPARAR APK FINAL
      # ============================================================
      - name: Preparar APK
        run: |
          set -e

          mkdir -p final

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            final/carga-dutra-99999.apk

          echo ""
          echo "=========================================="
          echo "APK GERADO"
          echo "=========================================="

          ls -lh final/carga-dutra-99999.apk


      # ============================================================
      # 15. ENVIAR APK PARA ARTIFACT
      # ============================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-99999-apk
          path: final/carga-dutra-99999.apk
          if-no-files-found: error
          retention-days: 7       
