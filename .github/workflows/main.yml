name: Encontrar atualizacao do contador

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar jogo
        run: |
          curl -L --max-time 60 -s \
            "https://cargadutra.netlify.app/" \
            -o /tmp/index.html

      - name: Decodificar JavaScript
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse

          html = open(
              "/tmp/index.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          script = next(
              (s for s in scripts if s.startswith("data:text/javascript")),
              None
          )

          if not script:
              print("ERRO: script do jogo nao encontrado.")
              raise SystemExit(0)

          header, data = script.split(",", 1)
          data = urllib.parse.unquote(data)

          if ";base64" in header.lower():
              js = base64.b64decode(data).decode(
                  "utf-8",
                  errors="ignore"
              )
          else:
              js = data

          open(
              "/tmp/game.js",
              "w",
              encoding="utf-8"
          ).write(js)

          print("JavaScript decodificado:", len(js), "caracteres")
          PY

      - name: Procurar atualizacao do HUD Timer
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("ATUALIZACOES DO HUD TIMER")
          print("========================================")

          padroes = [
              r'ui\.hudTimer',
              r'hudTimer\.textContent',
              r'hudTimer\.innerText',
              r'hudTimer\.innerHTML',
              r'formatTime\(',
              r'formatTime\s*\('
          ]

          resultados = []

          for padrao in padroes:
              for m in re.finditer(padrao, js, re.I):
                  resultados.append(
                      (m.start(), m.group(0))
                  )

          resultados.sort()

          if not resultados:
              print("NENHUMA REFERENCIA ENCONTRADA.")
              raise SystemExit(0)

          vistos = set()
          total = 0

          for pos, termo in resultados:

              inicio = max(0, pos - 1000)
              fim = min(len(js), pos + 1400)

              trecho = js[inicio:fim]

              # Remove excesso de espacos
              trecho = re.sub(r'\s+', ' ', trecho)

              # Cria quebras para facilitar a leitura
              trecho = trecho.replace(';', ';\n')
              trecho = trecho.replace('{', '{\n')
              trecho = trecho.replace('}', '}\n')

              # Evita duplicatas
              chave = trecho[:500]

              if chave in vistos:
                  continue

              vistos.add(chave)

              print("")
              print("----------------------------------------")
              print("TERMO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")
              print(trecho[:2600])

              total += 1

              if total >= 25:
                  break

          print("")
          print("Total de referencias mostradas:", total)
          PY

      - name: Procurar chamadas de formatTime
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/game.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("CHAMADAS formatTime")
          print("========================================")

          encontrados = list(
              re.finditer(
                  r'formatTime\s*\(',
                  js,
                  re.I
              )
          )

          print("Quantidade:", len(encontrados))

          for i, m in enumerate(encontrados[:30], 1):

              inicio = max(0, m.start() - 900)
              fim = min(len(js), m.start() + 1500)

              trecho = js[inicio:fim]

              trecho = re.sub(r'\s+', ' ', trecho)
              trecho = trecho.replace(';', ';\n')

              print("")
              print("----------------------------------------")
              print("CHAMADA", i)
              print("POSICAO:", m.start())
              print("----------------------------------------")
              print(trecho[:2400])

          print("")
          print("========================================")
          print("FIM")
          print("========================================")
          PY
