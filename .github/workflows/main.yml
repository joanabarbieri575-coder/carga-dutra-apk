name: Encontrar Simulator e getHUD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar jogo
        run: |
          curl -L --max-time 60 -s \
            "https://cargadutra.netlify.app/" \
            -o /tmp/index.html

      - name: Decodificar módulos
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse

          html = open(
              "/tmp/index.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          def decode(url):
              try:
                  header, data = url.split(",", 1)
                  data = urllib.parse.unquote(data)

                  if ";base64" in header.lower():
                      return base64.b64decode(data).decode(
                          "utf-8",
                          errors="ignore"
                      )

                  return data
              except:
                  return ""

          principal = None

          for src in scripts:
              if src.startswith("data:text/javascript"):
                  principal = src
                  break

          if not principal:
              print("ERRO: modulo principal nao encontrado.")
              raise SystemExit(1)

          principal_js = decode(principal)

          arquivos = [("principal", principal_js)]
          fila = re.findall(
              r'(?:from|import)\s*[\'"]?(data:text/javascript[^\'"\s]+)',
              principal_js,
              re.I
          )

          vistos = set()

          while fila:
              url = fila.pop(0)

              if url in vistos:
                  continue

              vistos.add(url)

              js = decode(url)

              if not js:
                  continue

              nome = f"modulo_{len(arquivos)}"

              arquivos.append((nome, js))

              novos = re.findall(
                  r'(?:from|import)\s*[\'"]?(data:text/javascript[^\'"\s]+)',
                  js,
                  re.I
              )

              for novo in novos:
                  if novo not in vistos:
                      fila.append(novo)

          with open(
              "/tmp/todos_modulos.js",
              "w",
              encoding="utf-8"
          ) as f:

              for nome, js in arquivos:
                  f.write(
                      "\n\n/* ===== " + nome + " ===== */\n\n"
                  )
                  f.write(js)

          print("========================================")
          print("MODULOS DECODIFICADOS")
          print("========================================")
          print("Total:", len(arquivos))

          for nome, js in arquivos:
              print(nome, len(js), "caracteres")
          PY

      - name: Encontrar Simulator
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/todos_modulos.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("SIMULATOR / getHUD")
          print("========================================")

          padroes = [
              r'class\s+Simulator',
              r'getHUD\s*\(',
              r'getHUD\s*=\s*\(',
              r'getHUD\s*:',
              r'elapsed\s*:',
              r'this\.elapsed',
              r'elapsed\s*=',
              r'performance\.now\s*\(',
              r'Date\.now\s*\(',
              r'create\s*\('
          ]

          encontrados = []

          for padrao in padroes:
              for m in re.finditer(padrao, js, re.I):
                  encontrados.append(
                      (m.start(), m.group(0))
                  )

          encontrados.sort()

          vistos = set()
          total = 0

          for pos, termo in encontrados:

              inicio = max(0, pos - 1800)
              fim = min(len(js), pos + 3500)

              trecho = js[inicio:fim]

              baixo = trecho.lower()

              # Só mostrar trechos realmente relacionados
              if not any(x in baixo for x in [
                  "simulator",
                  "gethud",
                  "elapsed"
              ]):
                  continue

              trecho = re.sub(
                  r'\s+',
                  ' ',
                  trecho
              )

              chave = trecho[:1000]

              if chave in vistos:
                  continue

              vistos.add(chave)

              print("")
              print("----------------------------------------")
              print("TERMO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")
              print(trecho[:5000])

              total += 1

              if total >= 15:
                  break

          print("")
          print("========================================")
          print("TRECHOS MOSTRADOS:", total)
          print("========================================")
          PY

      - name: Procurar calculo do elapsed
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/todos_modulos.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("CALCULO DO TEMPO")
          print("========================================")

          padroes = [
              r'elapsed\s*[:=]',
              r'this\.elapsed',
              r'elapsed\s*\+=',
              r'elapsed\s*=\s*.*?performance',
              r'performance\.now\(\).*?elapsed',
              r'elapsed.*?performance\.now',
              r'startTime',
              r'startTimestamp',
              r'startedAt',
              r'timerStart',
              r'gameTime'
          ]

          total = 0
          vistos = set()

          for padrao in padroes:

              for m in re.finditer(
                  padrao,
                  js,
                  re.I
              ):

                  inicio = max(0, m.start() - 1200)
                  fim = min(len(js), m.end() + 2200)

                  trecho = js[inicio:fim]

                  trecho = re.sub(
                      r'\s+',
                      ' ',
                      trecho
                  )

                  chave = trecho[:900]

                  if chave in vistos:
                      continue

                  vistos.add(chave)

                  print("")
                  print("----------------------------------------")
                  print("PADRAO:", padrao)
                  print("POSICAO:", m.start())
                  print("----------------------------------------")
                  print(trecho[:3500])

                  total += 1

                  if total >= 20:
                      break

              if total >= 20:
                  break

          print("")
          print("========================================")
          print("TOTAL:", total)
          print("========================================")
          PY
