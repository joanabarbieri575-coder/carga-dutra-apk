name: Encontrar origem do hud elapsed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar jogo
        run: |
          curl -L --max-time 60 -s \
            "https://cargadutra.netlify.app/" \
            -o /tmp/index.html

      - name: Decodificar todos os modulos internos
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse

          html = open(
              "/tmp/index.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          # Primeiro script
          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          principal = None

          for src in scripts:
              if src.startswith("data:text/javascript"):
                  principal = src
                  break

          if not principal:
              print("ERRO: script principal nao encontrado.")
              raise SystemExit(0)

          def decode_data_url(url):
              try:
                  header, data = url.split(",", 1)
                  data = urllib.parse.unquote(data)

                  if ";base64" in header.lower():
                      return base64.b64decode(data).decode(
                          "utf-8",
                          errors="ignore"
                      )

                  return data

              except Exception as e:
                  print("Falha ao decodificar:", e)
                  return ""

          principal_js = decode_data_url(principal)

          # Guarda o principal
          open(
              "/tmp/game.js",
              "w",
              encoding="utf-8"
          ).write(principal_js)

          # Procura TODOS os imports data:text/javascript
          modulos = re.findall(
              r'from\s+[\'"]?(data:text/javascript[^\'"\s]+)',
              principal_js,
              re.I
          )

          # Outra forma de import
          modulos += re.findall(
              r'import\s*\(\s*[\'"]?(data:text/javascript[^\'"\s]+)',
              principal_js,
              re.I
          )

          print("")
          print("========================================")
          print("MODULOS ENCONTRADOS")
          print("========================================")
          print("Principal:", len(principal_js), "caracteres")
          print("Modulos internos:", len(modulos))

          arquivos = []

          # Principal
          arquivos.append(
              ("principal", principal_js)
          )

          for i, modulo in enumerate(modulos):

              js = decode_data_url(modulo)

              if js:
                  caminho = f"/tmp/modulo_{i}.js"

                  open(
                      caminho,
                      "w",
                      encoding="utf-8"
                  ).write(js)

                  arquivos.append(
                      (f"modulo_{i}", js)
                  )

                  print(
                      f"[OK] modulo_{i}:",
                      len(js),
                      "caracteres"
                  )

          print("")
          print("Total de arquivos analisados:", len(arquivos))

          # Cria um arquivo único
          with open(
              "/tmp/todos_modulos.js",
              "w",
              encoding="utf-8"
          ) as saida:

              for nome, js in arquivos:
                  saida.write(
                      "\n\n/* ===== " + nome + " ===== */\n\n"
                  )
                  saida.write(js)

          print("Arquivo combinado criado.")
          PY

      - name: Procurar getHUD e elapsed
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/todos_modulos.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("ORIGEM DE hud.elapsed")
          print("========================================")

          termos = [
              "getHUD",
              "elapsed",
              "this.elapsed",
              "elapsed =",
              "elapsed:",
              "startTime",
              "startTimestamp",
              "performance.now",
              "Date.now",
              "requestAnimationFrame",
              "update(dt)",
              "update(delta",
              "getElapsed"
          ]

          resultados = []

          for termo in termos:

              inicio = 0

              while True:

                  pos = js.lower().find(
                      termo.lower(),
                      inicio
                  )

                  if pos == -1:
                      break

                  resultados.append(
                      (pos, termo)
                  )

                  inicio = pos + len(termo)

          resultados.sort()

          vistos = set()
          total = 0

          for pos, termo in resultados:

              inicio = max(0, pos - 1000)
              fim = min(len(js), pos + 1800)

              trecho = js[inicio:fim]

              baixo = trecho.lower()

              # Prioriza trechos realmente ligados ao contador
              palavras = [
                  "gethud",
                  "elapsed",
                  "starttime",
                  "starttimestamp",
                  "performance.now",
                  "date.now",
                  "requestanimationframe"
              ]

              if not any(
                  palavra in baixo
                  for palavra in palavras
              ):
                  continue

              # Limita e organiza
              trecho = re.sub(
                  r'\s+',
                  ' ',
                  trecho
              )

              trecho = trecho.replace(
                  ';',
                  ';\n'
              )

              trecho = trecho.replace(
                  '{',
                  '{\n'
              )

              trecho = trecho.replace(
                  '}',
                  '}\n'
              )

              chave = trecho[:600]

              if chave in vistos:
                  continue

              vistos.add(chave)

              print("")
              print("----------------------------------------")
              print("TERMO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")
              print(trecho[:3200])

              total += 1

              if total >= 30:
                  break

          print("")
          print("========================================")
          print("TRECHOS MOSTRADOS:", total)
          print("========================================")
          PY

      - name: Procurar constantes de tempo
        run: |
          python3 <<'PY'
          import re

          js = open(
              "/tmp/todos_modulos.js",
              encoding="utf-8",
              errors="ignore"
          ).read()

          print("")
          print("========================================")
          print("CONSTANTES RELACIONADAS AO TEMPO")
          print("========================================")

          padroes = [
              r'\b\d+\s*\*\s*60\b',
              r'\b\d+\s*\*\s*1000\b',
              r'\b\d{2,}\s*(?:[,;)}])',
              r'timeLimit',
              r'timeLimitSeconds',
              r'levelTime',
              r'maxTime',
              r'targetTime',
              r'elapsed'
          ]

          encontrados = []

          for padrao in padroes:

              for m in re.finditer(
                  padrao,
                  js,
                  re.I
              ):

                  trecho = js[
                      max(0, m.start() - 500):
                      min(len(js), m.end() + 700)
                  ]

                  baixo = trecho.lower()

                  if any(
                      x in baixo
                      for x in [
                          "time",
                          "elapsed",
                          "timer",
                          "level"
                      ]
                  ):
                      encontrados.append(
                          (m.start(), m.group(0), trecho)
                      )

          vistos = set()
          total = 0

          for pos, termo, trecho in encontrados:

              chave = trecho[:400]

              if chave in vistos:
                  continue

              vistos.add(chave)

              trecho = re.sub(
                  r'\s+',
                  ' ',
                  trecho
              )

              print("")
              print("----------------------------------------")
              print("TERMO:", termo)
              print("POSICAO:", pos)
              print("----------------------------------------")
              print(trecho[:1800])

              total += 1

              if total >= 20:
                  break

          print("")
          print("Trechos mostrados:", total)
          PY

      - name: Final
        run: |
          echo ""
          echo "========================================"
          echo "ANALISE CONCLUIDA"
          echo "========================================"
          echo ""
          echo "O jogo ainda nao foi alterado."
          echo "O objetivo agora e encontrar exatamente"
          echo "como Simulator calcula hud.elapsed."
