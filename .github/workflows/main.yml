name: Carga Dutra V4 - Mobile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1 - BAIXAR O JOGO ORIGINAL
      # ==================================================
      - name: Baixar jogo original
        run: |
          mkdir -p web

          curl -L \
            --retry 5 \
            --retry-delay 2 \
            -A "Mozilla/5.0 (Linux; Android 14)" \
            "https://cargadutra.netlify.app/" \
            -o web/index.html

          echo "HTML original:"
          wc -c web/index.html


      # ==================================================
      # 2 - PYTHON
      # ==================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ==================================================
      # 3 - ALTERAR TIMER DENTRO DOS MÓDULOS
      # ==================================================
      - name: Alterar timer para 99999
        run: |

          cat > /tmp/modificar.py <<'PY'
          import re
          import base64
          from urllib.parse import unquote, quote

          arquivo = "web/index.html"

          with open(arquivo, "r", encoding="utf-8") as f:
              html = f.read()

          processados = set()
          total = 0
          timer_ok = False


          def decode_data_url(url):
              try:
                  header, data = url.split(",", 1)

                  if ";base64" in header.lower():
                      return base64.b64decode(data).decode("utf-8")

                  return unquote(data)

              except Exception:
                  return None


          def encode_data_url(url, texto):
              try:
                  header, _ = url.split(",", 1)

                  if ";base64" in header.lower():
                      dados = base64.b64encode(
                          texto.encode("utf-8")
                      ).decode("ascii")

                      return header + "," + dados

                  return header + "," + quote(
                      texto,
                      safe=""
                  )

              except Exception:
                  return url


          def processar(texto, nivel=0):
              global total
              global timer_ok

              indent = "  " * nivel

              # ------------------------------------------
              # TIMER DO SIMULATOR
              # ------------------------------------------
              padrao = r'this\.state\.elapsed\s*\+=\s*dt\s*;'

              if re.search(padrao, texto):

                  print(indent + ">>> TIMER ENCONTRADO")

                  novo = re.sub(
                      padrao,
                      "this.state.elapsed = 99999;",
                      texto
                  )

                  if novo != texto:

                      texto = novo
                      timer_ok = True

                      print(
                          indent +
                          ">>> TIMER INTERNO = 99999"
                      )


              # ------------------------------------------
              # MÓDULOS DATA:
              # ------------------------------------------
              padrao_data = (
                  r'(?P<q>["\'])'
                  r'(?P<url>data:[^"\']+)'
                  r'(?P=q)'
              )


              def substituir(match):

                  global total

                  url = match.group("url")

                  if url in processados:
                      return match.group(0)

                  decodificado = decode_data_url(url)

                  if decodificado is None:
                      return match.group(0)

                  processados.add(url)
                  total += 1

                  print(
                      indent +
                      "Módulo:",
                      len(decodificado),
                      "bytes"
                  )

                  novo = processar(
                      decodificado,
                      nivel + 1
                  )

                  return (
                      match.group("q") +
                      encode_data_url(url, novo) +
                      match.group("q")
                  )


              return re.sub(
                  padrao_data,
                  substituir,
                  texto
              )


          resultado = processar(html)


          with open(arquivo, "w", encoding="utf-8") as f:
              f.write(resultado)


          print()
          print("=" * 50)
          print("RESULTADO DA MODIFICAÇÃO")
          print("=" * 50)
          print("Timer encontrado:", timer_ok)
          print("Módulos:", total)
          print("HTML final:", len(resultado), "bytes")


          if not timer_ok:
              raise SystemExit(
                  "ERRO: TIMER NÃO ENCONTRADO"
              )

          print("Timer configurado para 99999.")

          PY

          python /tmp/modificar.py


      # ==================================================
      # 4 - CRIAR PROJETO NODE
      # ==================================================
      - name: Criar projeto Node
        run: |
          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android


      # ==================================================
      # 5 - CAPACITOR
      # ==================================================
      - name: Inicializar Capacitor
        run: |
          npx cap init \
            "Carga Dutra" \
            "com.cargadutra.game" \
            --web-dir web


      # ==================================================
      # 6 - ANDROID
      # ==================================================
      - name: Adicionar Android
        run: |
          npx cap add android


      # ==================================================
      # 7 - MANIFEST
      # ==================================================
      - name: Configurar AndroidManifest
        run: |

          python - <<'PY'

          import re

          caminho = (
              "android/app/src/main/AndroidManifest.xml"
          )

          with open(caminho, "r", encoding="utf-8") as f:
              texto = f.read()


          # ----------------------------------------------
          # MANIFEST
          # ----------------------------------------------
          manifest = re.search(
              r'<manifest\b[^>]*>',
              texto,
              re.IGNORECASE
          )

          if not manifest:
              raise SystemExit(
                  "ERRO: manifest não encontrado"
              )


          permissoes = """
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO" />
          """


          if "android.permission.INTERNET" not in texto:

              texto = (
                  texto[:manifest.end()]
                  + permissoes
                  + texto[manifest.end():]
              )


          # ----------------------------------------------
          # APPLICATION
          # ----------------------------------------------
          app = re.search(
              r'<application\b[^>]*>',
              texto,
              re.IGNORECASE
          )

          if not app:
              raise SystemExit(
                  "ERRO: application não encontrado"
              )


          tag = app.group(0)


          if "android:hardwareAccelerated=" not in tag:

              nova = (
                  tag[:-1] +
                  ' android:hardwareAccelerated="true">'
              )

              texto = (
                  texto[:app.start()]
                  + nova
                  + texto[app.end():]
              )


          app = re.search(
              r'<application\b[^>]*>',
              texto,
              re.IGNORECASE
          )

          tag = app.group(0)


          if "android:usesCleartextTraffic=" not in tag:

              nova = (
                  tag[:-1] +
                  ' android:usesCleartextTraffic="true">'
              )

              texto = (
                  texto[:app.start()]
                  + nova
                  + texto[app.end():]
              )


          with open(caminho, "w", encoding="utf-8") as f:
              f.write(texto)


          print("AndroidManifest configurado.")

          PY


      # ==================================================
      # 8 - MAINACTIVITY MOBILE
      # ==================================================
      - name: Configurar WebView para celular
        run: |

          mkdir -p \
            android/app/src/main/java/com/cargadutra/game


          cat > android/app/src/main/java/com/cargadutra/game/MainActivity.java <<'JAVA'

          package com.cargadutra.game;

          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;


          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  // Tela aproveitando todo o espaço disponível
                  Window window = getWindow();

                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );


                  WebView webView =
                      getBridge().getWebView();


                  if (webView != null) {

                      WebSettings settings =
                          webView.getSettings();


                      // ==================================
                      // JAVASCRIPT
                      // ==================================
                      settings.setJavaScriptEnabled(true);


                      // ==================================
                      // STORAGE
                      // ==================================
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);


                      // ==================================
                      // ARQUIVOS / DATA URL
                      // ==================================
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);


                      // ==================================
                      // WEBGL / HARDWARE
                      // ==================================
                      webView.setLayerType(
                          WebView.LAYER_TYPE_HARDWARE,
                          null
                      );


                      // ==================================
                      // VÍDEO / ÁUDIO
                      // ==================================
                      settings.setMediaPlaybackRequiresUserGesture(
                          false
                      );


                      // ==================================
                      // NÃO USAR ZOOM DE DESKTOP
                      // ==================================
                      settings.setBuiltInZoomControls(false);
                      settings.setDisplayZoomControls(false);


                      // ==================================
                      // ESCALA NATIVA DO CELULAR
                      // ==================================
                      settings.setUseWideViewPort(false);
                      settings.setLoadWithOverviewMode(false);


                      // ==================================
                      // CACHE
                      // ==================================
                      settings.setCacheMode(
                          WebSettings.LOAD_DEFAULT
                      );


                      // ==================================
                      // MIXED CONTENT
                      // ==================================
                      if (
                          android.os.Build.VERSION.SDK_INT >= 21
                      ) {

                          settings.setMixedContentMode(
                              WebSettings
                                  .MIXED_CONTENT_COMPATIBILITY_MODE
                          );
                      }


                      // ==================================
                      // IMAGENS
                      // ==================================
                      settings.setLoadsImagesAutomatically(true);


                      // ==================================
                      // JAVASCRIPT PODE ABRIR JANELAS
                      // ==================================
                      settings.setJavaScriptCanOpenWindowsAutomatically(
                          true
                      );


                      // ==================================
                      // USER AGENT MOBILE
                      // ==================================
                      settings.setUserAgentString(
                          "Mozilla/5.0 " +
                          "(Linux; Android 14; Mobile) " +
                          "AppleWebKit/537.36 " +
                          "(KHTML, like Gecko) " +
                          "Chrome/140.0.0.0 " +
                          "Mobile Safari/537.36"
                      );


                      // ==================================
                      // GARANTIR FOCO NO WEBVIEW
                      // ==================================
                      webView.setFocusable(true);
                      webView.setFocusableInTouchMode(true);
                      webView.requestFocus();
                  }
              }
          }

          JAVA


      # ==================================================
      # 9 - COPIAR WEB PARA ANDROID
      # ==================================================
      - name: Copiar arquivos
        run: |
          npx cap copy android


      # ==================================================
      # 10 - KOTLIN
      # ==================================================
      - name: Corrigir Kotlin
        run: |

          cat >> android/build.gradle <<'GRADLE'

          allprojects {

              configurations.all {

                  resolutionStrategy {

                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'

                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'

                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'

                  }
              }
          }

          GRADLE


      # ==================================================
      # 11 - JAVA 21
      # ==================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==================================================
      # 12 - ANDROID SDK
      # ==================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # 13 - GRADLE
      # ==================================================
      - name: Dar permissão ao Gradle
        run: |
          chmod +x android/gradlew


      # ==================================================
      # 14 - LIMPAR
      # ==================================================
      - name: Limpar projeto
        working-directory: android
        run: |
          ./gradlew clean


      # ==================================================
      # 15 - GERAR APK
      # ==================================================
      - name: Gerar APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace


      # ==================================================
      # 16 - VERIFICAR
      # ==================================================
      - name: Verificar APK
        run: |
          echo "APK encontrado:"
          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==================================================
      # 17 - PUBLICAR
      # ==================================================
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-v4-mobile-99999
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
