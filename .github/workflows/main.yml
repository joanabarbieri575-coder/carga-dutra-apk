name: Carga Dutra - APK 99999

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. BAIXAR O JOGO ORIGINAL
      # ==========================================
      - name: Baixar jogo
        run: |
          mkdir -p web
          curl -L "https://cargadutra.netlify.app/" -o web/index.html

          echo "HTML original:"
          wc -c web/index.html

      # ==========================================
      # 2. INSTALAR PYTHON
      # ==========================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ==========================================
      # 3. MODIFICAR O JOGO
      # ==========================================
      - name: Modificar timer do jogo
        run: |
          cat > /tmp/modificar.py <<'PY'
          import re
          import base64
          from urllib.parse import unquote

          INPUT = "web/index.html"

          with open(INPUT, "r", encoding="utf-8") as f:
              html = f.read()

          print("HTML original:", len(html), "bytes")

          processados = set()
          total = 0
          timer_encontrado = False

          def decode_data_url(url):
              if not url.startswith("data:"):
                  return None

              try:
                  header, data = url.split(",", 1)

                  if ";base64" in header.lower():
                      return base64.b64decode(data).decode("utf-8")
                  else:
                      return unquote(data)

              except Exception:
                  return None

          def encode_data_url(original_url, text):
              try:
                  header, _ = original_url.split(",", 1)

                  if ";base64" in header.lower():
                      encoded = base64.b64encode(
                          text.encode("utf-8")
                      ).decode("ascii")
                      return header + "," + encoded
                  else:
                      from urllib.parse import quote
                      return header + "," + quote(text, safe="")

              except Exception:
                  return original_url

          def modificar_modulo(text, nivel=0):
              global total, timer_encontrado

              indent = "  " * nivel

              # ------------------------------------------
              # TIMER INTERNO
              # ------------------------------------------
              padrao_timer = r'this\.state\.elapsed\s*\+=\s*dt\s*;'

              if re.search(padrao_timer, text):
                  print(indent + ">>> TIMER ENCONTRADO")

                  text_novo = re.sub(
                      padrao_timer,
                      "this.state.elapsed = 99999;",
                      text
                  )

                  if text_novo != text:
                      text = text_novo
                      timer_encontrado = True
                      print(indent + ">>> TIMER INTERNO = 99999")

              # ------------------------------------------
              # PROCESSAR DATA URLs DENTRO DO MÓDULO
              # ------------------------------------------
              pattern = r'(?P<quote>["\'])(?P<url>data:[^"\']+)(?P=quote)'

              def substituir(match):
                  nonlocal text
                  global total

                  url = match.group("url")

                  if url in processados:
                      return match.group(0)

                  decoded = decode_data_url(url)

                  if decoded is None:
                      return match.group(0)

                  processados.add(url)
                  total += 1

                  print(indent + "Módulo:", len(decoded), "bytes")

                  novo = modificar_modulo(decoded, nivel + 1)

                  return match.group("quote") + encode_data_url(url, novo) + match.group("quote")

              text = re.sub(pattern, substituir, text)

              return text

          print("Script principal encontrado.")

          resultado = modificar_modulo(html)

          with open(INPUT, "w", encoding="utf-8") as f:
              f.write(resultado)

          print()
          print("=" * 42)
          print("JOGO MODIFICADO COM SUCESSO")
          print("=" * 42)
          print("Timer interno:", "99999" if timer_encontrado else "NÃO ENCONTRADO")
          print("Módulos processados:", total)
          print("HTML final:", len(resultado), "bytes")
          print("Arquivo:", INPUT)

          if not timer_encontrado:
              raise SystemExit("ERRO: não foi possível encontrar o timer.")

          PY

          python /tmp/modificar.py

      # ==========================================
      # 4. CRIAR PROJETO NODE
      # ==========================================
      - name: Criar projeto
        run: |
          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # ==========================================
      # 5. CONFIGURAR CAPACITOR
      # ==========================================
      - name: Configurar Capacitor
        run: |
          npx cap init "Carga Dutra" "com.cargadutra.game" --web-dir web

      # ==========================================
      # 6. CRIAR PROJETO ANDROID
      # ==========================================
      - name: Adicionar Android
        run: |
          npx cap add android

      # ==========================================
      # 7. CORRIGIR ANDROIDMANIFEST
      # ==========================================
      - name: Configurar AndroidManifest
        run: |
          python - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # ------------------------------------------
          # ENCONTRAR A TAG <manifest ...>
          # ------------------------------------------
          match = re.search(
              r'<manifest\b[^>]*>',
              text,
              flags=re.IGNORECASE
          )

          if not match:
              raise SystemExit("Tag <manifest> não encontrada.")

          manifest_tag = match.group(0)

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
          """

          if "android.permission.INTERNET" not in text:
              text = (
                  text[:match.end()]
                  + permissions
                  + text[match.end():]
              )

          # ------------------------------------------
          # CONFIGURAR <application>
          # ------------------------------------------
          app_match = re.search(
              r'<application\b[^>]*>',
              text,
              flags=re.IGNORECASE
          )

          if not app_match:
              raise SystemExit("Tag <application> não encontrada.")

          app_tag = app_match.group(0)

          # Hardware acceleration
          if "android:hardwareAccelerated=" not in app_tag:
              novo_app_tag = app_tag[:-1] + ' android:hardwareAccelerated="true">'
              text = (
                  text[:app_match.start()]
                  + novo_app_tag
                  + text[app_match.end():]
              )

          # Permitir conteúdo HTTP caso algum recurso do jogo precise
          app_match = re.search(
              r'<application\b[^>]*>',
              text,
              flags=re.IGNORECASE
          )

          app_tag = app_match.group(0)

          if "android:usesCleartextTraffic=" not in app_tag:
              novo_app_tag = (
                  app_tag[:-1]
                  + ' android:usesCleartextTraffic="true">'
              )

              text = (
                  text[:app_match.start()]
                  + novo_app_tag
                  + text[app_match.end():]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("AndroidManifest configurado corretamente.")
          print()
          print(text)
          PY

      # ==========================================
      # 8. CRIAR MAINACTIVITY ESTÁVEL PARA WEBVIEW
      # ==========================================
      - name: Configurar MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/cargadutra/game

          cat > android/app/src/main/java/com/cargadutra/game/MainActivity.java <<'JAVA'
          package com.cargadutra.game;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {
                      WebSettings settings = webView.getSettings();

                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);

                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);

                      settings.setMediaPlaybackRequiresUserGesture(false);

                      if (android.os.Build.VERSION.SDK_INT >= 21) {
                          settings.setMixedContentMode(
                              WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                          );
                      }

                      webView.setLayerType(
                          WebView.LAYER_TYPE_HARDWARE,
                          null
                      );
                  }
              }
          }
          JAVA

          echo "MainActivity configurada."

      # ==========================================
      # 9. COPIAR JOGO PARA ANDROID
      # ==========================================
      - name: Copiar jogo
        run: |
          npx cap copy android

      # ==========================================
      # 10. FORÇAR KOTLIN COMPATÍVEL
      # ==========================================
      - name: Corrigir dependências Kotlin
        run: |
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          GRADLE

      # ==========================================
      # 11. JAVA 21
      # ==========================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==========================================
      # 12. ANDROID SDK
      # ==========================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 13. DAR PERMISSÃO AO GRADLE
      # ==========================================
      - name: Permissão Gradle
        run: |
          chmod +x android/gradlew

      # ==========================================
      # 14. LIMPAR PROJETO
      # ==========================================
      - name: Limpar Android
        working-directory: android
        run: |
          ./gradlew clean

      # ==========================================
      # 15. GERAR APK
      # ==========================================
      - name: Gerar APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      # ==========================================
      # 16. VERIFICAR APK
      # ==========================================
      - name: Verificar APK
        run: |
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      # ==========================================
      # 17. DISPONIBILIZAR APK
      # ==========================================
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-99999-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
