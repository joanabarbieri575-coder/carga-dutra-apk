name: Gerar Carga Dutra 99999

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar jogo original
        run: |
          curl -L --fail --max-time 120 \
            "https://cargadutra.netlify.app/" \
            -o original.html

          echo "HTML baixado:"
          wc -c original.html

      - name: Modificar módulos do jogo
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse
          import os

          html = open(
              "original.html",
              "r",
              encoding="utf-8",
              errors="ignore"
          ).read()

          os.makedirs("dist", exist_ok=True)

          def decode_data_url(url):
              header, data = url.split(",", 1)
              data = urllib.parse.unquote(data)

              if ";base64" in header.lower():
                  return base64.b64decode(data).decode(
                      "utf-8",
                      errors="ignore"
                  )

              return data

          def encode_data_url(js):
              encoded = base64.b64encode(
                  js.encode("utf-8")
              ).decode("ascii")

              return (
                  "data:text/javascript;charset=utf-8;base64,"
                  + encoded
              )

          # Encontrar script principal
          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          principal_url = None

          for src in scripts:
              if src.startswith("data:text/javascript"):
                  principal_url = src
                  break

          if not principal_url:
              raise SystemExit(
                  "ERRO: script principal não encontrado."
              )

          print("Script principal encontrado.")

          cache = {}

          import_pattern = re.compile(
              r'(?P<prefix>(?:from|import)\s*[\'"])'
              r'(?P<url>data:text/javascript[^\'"]+)'
              r'(?P<suffix>[\'"])',
              re.I
          )

          def process_module(url, nivel=0):

              if url in cache:
                  return cache[url]

              js = decode_data_url(url)

              print(
                  "  " * nivel +
                  "Módulo:",
                  len(js),
                  "bytes"
              )

              # Processar imports internos primeiro
              def replace_import(match):

                  old_url = match.group("url")

                  new_url = process_module(
                      old_url,
                      nivel + 1
                  )

                  return (
                      match.group("prefix")
                      + new_url
                      + match.group("suffix")
                  )

              js = import_pattern.sub(
                  replace_import,
                  js
              )

              # ========================================
              # TIMER REAL
              # ========================================

              antigo = "this.state.elapsed += dt;"
              novo = "this.state.elapsed = 99999;"

              if antigo in js:

                  print(
                      "  " * nivel +
                      ">>> TIMER ENCONTRADO!"
                  )

                  js = js.replace(
                      antigo,
                      novo,
                      1
                  )

                  print(
                      "  " * nivel +
                      ">>> TIMER ALTERADO PARA 99999!"
                  )

              cache[url] = encode_data_url(js)

              return cache[url]

          # Decodificar principal
          principal_js = decode_data_url(
              principal_url
          )

          print("")
          print("Processando módulos...")

          # Reconstruir imports do principal
          def replace_principal(match):

              old_url = match.group("url")

              new_url = process_module(
                  old_url,
                  1
              )

              return (
                  match.group("prefix")
                  + new_url
                  + match.group("suffix")
              )

          principal_js = import_pattern.sub(
              replace_principal,
              principal_js
          )

          # ========================================
          # VERIFICAR O PRINCIPAL
          # ========================================

          print("")
          print("========================================")
          print("VERIFICAÇÃO DA ALTERAÇÃO")
          print("========================================")

          # Procurar o texto antigo no principal
          if "this.state.elapsed += dt;" in principal_js:
              print(
                  "AVISO: incremento antigo ainda aparece no principal."
              )
          else:
              print(
                  "OK: incremento antigo não está no principal."
              )

          # Verificar se algum módulo processado contém
          # a versão modificada.
          modulo_modificado = False

          for url_codificado, novo_url in cache.items():

              js_teste = decode_data_url(
                  novo_url
              )

              if "this.state.elapsed = 99999;" in js_teste:
                  modulo_modificado = True
                  print(
                      "OK: módulo do Simulator contém "
                      "this.state.elapsed = 99999;"
                  )
                  break

          if not modulo_modificado:
              raise SystemExit(
                  "ERRO: não encontrei a alteração "
                  "dentro dos módulos reconstruídos."
              )

          # ========================================
          # GERAR PRINCIPAL FINAL
          # ========================================

          principal_final = encode_data_url(
              principal_js
          )

          html_final = html.replace(
              principal_url,
              principal_final,
              1
          )

          if html_final == html:
              raise SystemExit(
                  "ERRO: principal não foi inserido no HTML."
              )

          open(
              "dist/index.html",
              "w",
              encoding="utf-8"
          ).write(html_final)

          print("")
          print("========================================")
          print("SUCESSO")
          print("========================================")
          print("Módulos processados:", len(cache))
          print(
              "Timer interno configurado para 99999 segundos."
          )
          print(
              "Arquivo criado: dist/index.html"
          )
          print(
              "Tamanho:",
              len(html_final),
              "bytes"
          )
          PY

      - name: Criar ZIP
        run: |
          cd dist

          zip -9 ../carga-dutra-99999.zip index.html

          cd ..

          echo ""
          echo "========================================"
          echo "ZIP GERADO"
          echo "========================================"

          ls -lh carga-dutra-99999.zip

      - name: Testar ZIP
        run: |
          echo "Testando arquivo..."

          unzip -t carga-dutra-99999.zip

          echo ""
          echo "========================================"
          echo "TUDO CERTO"
          echo "========================================"
          echo "Arquivo: carga-dutra-99999.zip"

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-99999
          path: carga-dutra-99999.zip
          if-no-files-found: error
          retention-days: 7
