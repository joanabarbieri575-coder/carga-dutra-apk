name: Localizar codigo do jogo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Analisar site do jogo
        shell: bash
        run: |
          echo "========================================"
          echo "ANALISANDO CARGA DUTRA"
          echo "========================================"

          URL="https://cargadutra.netlify.app/"

          echo ""
          echo "Pagina principal:"
          curl -L -s "$URL" -o /tmp/index.html

          echo ""
          echo "Tamanho:"
          wc -c /tmp/index.html

          echo ""
          echo "========================================"
          echo "CONTEUDO DA PAGINA"
          echo "========================================"

          cat /tmp/index.html

      - name: Encontrar arquivos JavaScript
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "ARQUIVOS JAVASCRIPT"
          echo "========================================"

          grep -oE \
            '<script[^>]+src=["'\''][^"'\'']+["'\'']' \
            /tmp/index.html 2>/dev/null \
            || true

          echo ""
          echo "========================================"
          echo "URLS JAVASCRIPT"
          echo "========================================"

          grep -oE \
            'https?://[^"'\'' ]+\.js[^"'\'' ]*' \
            /tmp/index.html 2>/dev/null \
            | sort -u \
            || true

      - name: Procurar referencias ao contador
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "REFERENCIAS AO CONTADOR"
          echo "========================================"

          grep -niE \
            'timer|countdown|elapsed|remaining|timeLeft|targetTime|formatTime|seconds|duration|setInterval' \
            /tmp/index.html 2>/dev/null \
            | head -100 \
            || true

      - name: Final
        run: |
          echo ""
          echo "========================================"
          echo "DIAGNOSTICO CONCLUIDO"
          echo "========================================"
          echo ""
          echo "Nenhum arquivo do jogo foi alterado."
          echo "Nenhum APK foi gerado."
