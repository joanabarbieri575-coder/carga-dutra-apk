name: Carga Dutra - APK 3D 99999

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar jogo original
        run: |
          set -e

          curl -L --fail --max-time 120 \
            "https://cargadutra.netlify.app/" \
            -o original.html

          wc -c original.html


      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Modificar timer
        run: |
          set -e

          python3 <<'PY'
          import re
          import base64
          import urllib.parse
          import os

          html = open(
              "original.html",
              "r",
              encoding="utf-8",
              errors="ignore"
          ).read()

          os.makedirs("web", exist_ok=True)

          def decode_data_url(url):
              header, data = url.split(",", 1)
              data = urllib.parse.unquote(data)

              if ";base64" in header.lower():
                  return base64.b64decode(data).decode(
                      "utf-8",
                      errors="ignore"
                  )

              return data

          def encode_data_url(js):
              encoded = base64.b64encode(
                  js.encode("utf-8")
              ).decode("ascii")

              return (
                  "data:text/javascript;charset=utf-8;base64,"
                  + encoded
              )

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          data_scripts = [
              x for x in scripts
              if x.lower().startswith(
                  "data:text/javascript"
              )
          ]

          if not data_scripts:
              raise SystemExit(
                  "ERRO: script principal não encontrado."
              )

          principal_url = data_scripts[0]

          print("Script principal encontrado.")

          cache = {}
          timer_alterado = False

          pattern = re.compile(
              r'(?P<prefix>(?:from|import)\s*[\'"])'
              r'(?P<url>data:text/javascript[^\'"]+)'
              r'(?P<suffix>[\'"])',
              re.I
          )

          def process_module(url, nivel=0):

              global timer_alterado

              if url in cache:
                  return cache[url]

              js = decode_data_url(url)

              print(
                  "  " * nivel +
                  "Módulo:",
                  len(js),
                  "bytes"
              )

              def replace_import(match):

                  old_url = match.group("url")

                  new_url = process_module(
                      old_url,
                      nivel + 1
                  )

                  return (
                      match.group("prefix")
                      + new_url
                      + match.group("suffix")
                  )

              js = pattern.sub(
                  replace_import,
                  js
              )

              antigo = "this.state.elapsed += dt;"
              novo = "this.state.elapsed = 99999;"

              if antigo in js:

                  print(
                      "  " * nivel +
                      ">>> TIMER ENCONTRADO"
                  )

                  js = js.replace(
                      antigo,
                      novo,
                      1
                  )

                  timer_alterado = True

                  print(
                      "  " * nivel +
                      ">>> TIMER INTERNO = 99999"
                  )

              cache[url] = encode_data_url(js)

              return cache[url]

          principal_js = decode_data_url(
              principal_url
          )

          def replace_principal(match):

              old_url = match.group("url")

              new_url = process_module(
                  old_url,
                  1
              )

              return (
                  match.group("prefix")
                  + new_url
                  + match.group("suffix")
              )

          principal_js = pattern.sub(
              replace_principal,
              principal_js
          )

          if not timer_alterado:
              raise SystemExit(
                  "ERRO: timer não encontrado."
              )

          novo_principal = encode_data_url(
              principal_js
          )

          html_final = html.replace(
              principal_url,
              novo_principal,
              1
          )

          open(
              "web/index.html",
              "w",
              encoding="utf-8"
          ).write(html_final)

          print("")
          print("================================")
          print("JOGO MODIFICADO")
          print("================================")
          print("Timer interno: 99999")
          print("Módulos:", len(cache))
          print("HTML:", len(html_final), "bytes")
          PY


      - name: Instalar Capacitor
        run: |
          set -e

          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android


      - name: Inicializar Capacitor
        run: |
          set -e

          npx cap init \
            "Carga Dutra" \
            "com.cargadutra.game" \
            --web-dir web


      - name: Adicionar Android
        run: |
          set -e

          npx cap add android


      - name: Configurar WebView 3D
        run: |
          set -e

          python3 <<'PY'
          import os

          manifest = (
              "android/app/src/main/AndroidManifest.xml"
          )

          text = open(
              manifest,
              encoding="utf-8"
          ).read()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
          ]

          for permission in permissions:

              if permission not in text:

                  text = text.replace(
                      "<manifest",
                      "<manifest\n    " + permission,
                      1
                  )

          if "android:hardwareAccelerated" not in text:

              text = text.replace(
                  "<application",
                  '<application android:hardwareAccelerated="true"',
                  1
              )

          open(
              manifest,
              "w",
              encoding="utf-8"
          ).write(text)

          print("Hardware acceleration configurada.")

          activity = (
              "android/app/src/main/java/"
              "com/cargadutra/game/MainActivity.java"
          )

          if not os.path.exists(activity):
              raise SystemExit(
                  "MainActivity.java não encontrado."
              )

          source = open(
              activity,
              encoding="utf-8"
          ).read()

          if "android.webkit.WebSettings" not in source:

              source = source.replace(
                  "package com.cargadutra.game;",
                  """package com.cargadutra.game;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          """,
                  1
              )

          code = """

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {

                      WebSettings settings =
                          webView.getSettings();

                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);

                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);

                      settings.setJavaScriptCanOpenWindowsAutomatically(true);

                      settings.setMediaPlaybackRequiresUserGesture(false);

                      settings.setLoadsImagesAutomatically(true);

                      webView.setLayerType(
                          WebView.LAYER_TYPE_HARDWARE,
                          null
                      );
                  }
              }
          """

          if "setJavaScriptEnabled(true)" not in source:

              pos = source.rfind("}")

              if pos == -1:
                  raise SystemExit(
                      "Não foi possível modificar MainActivity."
                  )

              source = (
                  source[:pos]
                  + code
                  + "\n"
                  + source[pos:]
              )

          open(
              activity,
              "w",
              encoding="utf-8"
          ).write(source)

          print("WebView configurado.")
          PY


      - name: Copiar jogo para Android
        run: |
          set -e

          npx cap copy android


      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      - name: Corrigir Kotlin
        working-directory: android
        run: |
          set -e

          python3 <<'PY'

          path = "app/build.gradle"

          text = open(
              path,
              encoding="utf-8"
          ).read()

          bloco = """

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          """

          if "kotlin-stdlib:1.8.22" not in text:
              text += bloco

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(text)

          print("Kotlin configurado.")
          PY


      - name: Compilar APK
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Preparar APK
        run: |
          set -e

          mkdir -p final

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            final/carga-dutra-3d-99999.apk

          ls -lh final/carga-dutra-3d-99999.apk


      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-3d-99999-apk
          path: final/carga-dutra-3d-99999.apk
          if-no-files-found: error
          retention-days: 7
