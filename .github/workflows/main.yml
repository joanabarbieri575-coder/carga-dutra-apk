name: Carga Dutra V3 - APK WebGL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1 - BAIXAR O JOGO ORIGINAL
      # ==================================================
      - name: Baixar jogo original
        run: |
          mkdir -p web

          curl -L \
            --retry 5 \
            --retry-delay 2 \
            -A "Mozilla/5.0" \
            "https://cargadutra.netlify.app/" \
            -o web/index.html

          echo "Tamanho do HTML:"
          wc -c web/index.html


      # ==================================================
      # 2 - CONFIGURAR PYTHON
      # ==================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ==================================================
      # 3 - RECONSTRUIR OS MÓDULOS DATA:
      #    E ALTERAR O TIMER
      # ==================================================
      - name: Modificar jogo
        run: |

          cat > /tmp/modificar.py <<'PY'
          import re
          import base64
          from urllib.parse import unquote, quote

          arquivo = "web/index.html"

          with open(arquivo, "r", encoding="utf-8") as f:
              html = f.read()

          processados = set()
          total = 0
          timer_ok = False

          print("HTML original:", len(html), "bytes")


          def decode_data_url(url):

              try:
                  header, data = url.split(",", 1)

                  if ";base64" in header.lower():
                      return base64.b64decode(data).decode("utf-8")

                  return unquote(data)

              except Exception:
                  return None


          def encode_data_url(url, texto):

              try:
                  header, _ = url.split(",", 1)

                  if ";base64" in header.lower():

                      dados = base64.b64encode(
                          texto.encode("utf-8")
                      ).decode("ascii")

                      return header + "," + dados

                  return header + "," + quote(texto, safe="")

              except Exception:
                  return url


          def processar(texto, nivel=0):

              global total
              global timer_ok

              indent = "  " * nivel

              # ==========================================
              # TIMER
              # ==========================================

              padrao = r'this\.state\.elapsed\s*\+=\s*dt\s*;'

              if re.search(padrao, texto):

                  print(indent + ">>> TIMER ENCONTRADO")

                  novo = re.sub(
                      padrao,
                      "this.state.elapsed = 99999;",
                      texto
                  )

                  if novo != texto:

                      texto = novo
                      timer_ok = True

                      print(
                          indent +
                          ">>> TIMER INTERNO ALTERADO PARA 99999"
                      )


              # ==========================================
              # ENCONTRAR DATA: URL
              # ==========================================

              padrao_data = (
                  r'(?P<q>["\'])'
                  r'(?P<url>data:[^"\']+)'
                  r'(?P=q)'
              )


              def substituir(match):

                  global total

                  url = match.group("url")

                  if url in processados:
                      return match.group(0)

                  decodificado = decode_data_url(url)

                  if decodificado is None:
                      return match.group(0)

                  processados.add(url)

                  total += 1

                  print(
                      indent +
                      "Módulo:",
                      len(decodificado),
                      "bytes"
                  )

                  modificado = processar(
                      decodificado,
                      nivel + 1
                  )

                  novo_url = encode_data_url(
                      url,
                      modificado
                  )

                  return (
                      match.group("q") +
                      novo_url +
                      match.group("q")
                  )


              texto = re.sub(
                  padrao_data,
                  substituir,
                  texto
              )

              return texto


          resultado = processar(html)

          with open(arquivo, "w", encoding="utf-8") as f:
              f.write(resultado)


          print()
          print("=" * 50)
          print("RESULTADO")
          print("=" * 50)
          print("Timer encontrado:", timer_ok)
          print("Módulos processados:", total)
          print("HTML final:", len(resultado), "bytes")


          if not timer_ok:
              raise SystemExit(
                  "ERRO: TIMER NÃO FOI ENCONTRADO"
              )

          print("Jogo preparado com sucesso.")

          PY

          python /tmp/modificar.py


      # ==================================================
      # 4 - CRIAR PROJETO NODE
      # ==================================================
      - name: Criar projeto Node
        run: |
          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android


      # ==================================================
      # 5 - CONFIGURAR CAPACITOR
      # ==================================================
      - name: Inicializar Capacitor
        run: |
          npx cap init \
            "Carga Dutra" \
            "com.cargadutra.game" \
            --web-dir web


      # ==================================================
      # 6 - CRIAR ANDROID
      # ==================================================
      - name: Criar projeto Android
        run: |
          npx cap add android


      # ==================================================
      # 7 - CONFIGURAR MANIFEST DE FORMA SEGURA
      # ==================================================
      - name: Configurar AndroidManifest
        run: |

          python - <<'PY'

          import re

          caminho = (
              "android/app/src/main/AndroidManifest.xml"
          )

          with open(caminho, "r", encoding="utf-8") as f:
              texto = f.read()


          # ----------------------------------------------
          # PERMISSÕES
          # ----------------------------------------------

          match = re.search(
              r'<manifest\b[^>]*>',
              texto,
              re.IGNORECASE
          )

          if not match:
              raise SystemExit(
                  "ERRO: <manifest> não encontrado"
              )


          permissoes = """
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO" />
          """


          if "android.permission.INTERNET" not in texto:

              texto = (
                  texto[:match.end()]
                  + permissoes
                  + texto[match.end():]
              )


          # ----------------------------------------------
          # APPLICATION
          # ----------------------------------------------

          app = re.search(
              r'<application\b[^>]*>',
              texto,
              re.IGNORECASE
          )

          if not app:
              raise SystemExit(
                  "ERRO: <application> não encontrado"
              )


          tag = app.group(0)


          if "android:hardwareAccelerated=" not in tag:

              nova_tag = (
                  tag[:-1] +
                  ' android:hardwareAccelerated="true">'
              )

              texto = (
                  texto[:app.start()] +
                  nova_tag +
                  texto[app.end():]
              )


          # Permitir recursos HTTP caso existam
          app = re.search(
              r'<application\b[^>]*>',
              texto,
              re.IGNORECASE
          )

          tag = app.group(0)


          if "android:usesCleartextTraffic=" not in tag:

              nova_tag = (
                  tag[:-1] +
                  ' android:usesCleartextTraffic="true">'
              )

              texto = (
                  texto[:app.start()] +
                  nova_tag +
                  texto[app.end():]
              )


          with open(caminho, "w", encoding="utf-8") as f:
              f.write(texto)


          print("AndroidManifest OK")

          PY


      # ==================================================
      # 8 - MAIN ACTIVITY ESPECIAL PARA WEBGL
      # ==================================================
      - name: Configurar WebView WebGL
        run: |

          mkdir -p \
            android/app/src/main/java/com/cargadutra/game


          cat > android/app/src/main/java/com/cargadutra/game/MainActivity.java <<'JAVA'

          package com.cargadutra.game;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;


          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  WebView webView =
                      getBridge().getWebView();


                  if (webView != null) {

                      WebSettings settings =
                          webView.getSettings();


                      // JavaScript
                      settings.setJavaScriptEnabled(true);


                      // Armazenamento
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);


                      // Conteúdo local
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);


                      // Mídia
                      settings.setMediaPlaybackRequiresUserGesture(false);


                      // Zoom
                      settings.setBuiltInZoomControls(false);
                      settings.setDisplayZoomControls(false);


                      // Viewport
                      settings.setUseWideViewPort(false);
                      settings.setLoadWithOverviewMode(false);


                      // Cache
                      settings.setCacheMode(
                          WebSettings.LOAD_DEFAULT
                      );


                      // Mixed content
                      if (
                          android.os.Build.VERSION.SDK_INT >= 21
                      ) {

                          settings.setMixedContentMode(
                              WebSettings
                                  .MIXED_CONTENT_COMPATIBILITY_MODE
                          );
                      }


                      // HARDWARE / WEBGL
                      webView.setLayerType(
                          WebView.LAYER_TYPE_HARDWARE,
                          null
                      );


                      // Permitir JavaScript abrir novas janelas
                      settings.setJavaScriptCanOpenWindowsAutomatically(
                          true
                      );


                      // Melhor compatibilidade com recursos
                      settings.setLoadsImagesAutomatically(true);


                      // User Agent semelhante a navegador Android
                      String userAgent =
                          settings.getUserAgentString();

                      if (
                          userAgent == null ||
                          userAgent.length() == 0
                      ) {

                          settings.setUserAgentString(
                              "Mozilla/5.0 " +
                              "(Linux; Android 14) " +
                              "AppleWebKit/537.36 " +
                              "(KHTML, like Gecko) " +
                              "Chrome/140.0.0.0 " +
                              "Mobile Safari/537.36"
                          );
                      }
                  }
              }
          }

          JAVA


      # ==================================================
      # 9 - COPIAR OS ARQUIVOS PARA ANDROID
      # ==================================================
      - name: Copiar arquivos
        run: |
          npx cap copy android


      # ==================================================
      # 10 - FORÇAR VERSÕES DO KOTLIN
      # ==================================================
      - name: Corrigir Kotlin
        run: |

          cat >> android/build.gradle <<'GRADLE'

          allprojects {

              configurations.all {

                  resolutionStrategy {

                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'

                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'

                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'

                  }
              }
          }

          GRADLE


      # ==================================================
      # 11 - JAVA 21
      # ==================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==================================================
      # 12 - ANDROID SDK
      # ==================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # 13 - GRADLE
      # ==================================================
      - name: Permitir Gradle
        run: |
          chmod +x android/gradlew


      # ==================================================
      # 14 - LIMPAR
      # ==================================================
      - name: Limpar projeto
        working-directory: android
        run: |
          ./gradlew clean


      # ==================================================
      # 15 - GERAR APK
      # ==================================================
      - name: Gerar APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace


      # ==================================================
      # 16 - MOSTRAR APK
      # ==================================================
      - name: Verificar APK
        run: |
          echo "APKs encontrados:"
          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==================================================
      # 17 - ENVIAR APK
      # ==================================================
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-v3-99999
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
