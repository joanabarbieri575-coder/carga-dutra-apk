name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do jogo
        run: |
          mkdir -p app/src/main/assets
          curl -L "https://cargadutra.netlify.app/" -o app/src/main/assets/game.html

      - name: Modificar contador do jogo
        run: |
          python3 <<'PY'
          import re
          import base64

          path = "app/src/main/assets/game.html"

          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          # Localiza o módulo principal em data:
          pattern = r'(src=["\']data:text/javascript;charset=utf-8;base64,)([A-Za-z0-9+/=]+)(["\'])'
          match = re.search(pattern, html)

          if not match:
              raise Exception("Módulo principal do jogo não encontrado.")

          main = base64.b64decode(match.group(2)).decode("utf-8")

          # --------------------------------------------------
          # 1. Coloca todos os tempos das fases em 99999
          # --------------------------------------------------
          nested = re.search(
              r'data:text/javascript;charset=utf-8;base64,([A-Za-z0-9+/=]+)',
              main
          )

          if nested:
              config = base64.b64decode(nested.group(1)).decode("utf-8")

              config = re.sub(
                  r'targetTime\s*:\s*\d+',
                  'targetTime: 99999',
                  config
              )

              new_config = (
                  'data:text/javascript;charset=utf-8;base64,' +
                  base64.b64encode(config.encode("utf-8")).decode("ascii")
              )

              main = (
                  main[:nested.start()] +
                  new_config +
                  main[nested.end():]
              )

          # --------------------------------------------------
          # 2. Contador interno da partida = 99999
          # --------------------------------------------------
          main = main.replace(
              'this.state.elapsed += dt;',
              'this.state.elapsed = 99999;'
          )

          # --------------------------------------------------
          # 3. Se o HUD usar formatTime(elapsed), força 99999
          # --------------------------------------------------
          main = main.replace(
              'formatTime(this.state.elapsed)',
              '"99999"'
          )

          # --------------------------------------------------
          # 4. Salva o módulo modificado novamente em base64
          # --------------------------------------------------
          new_main = (
              'data:text/javascript;charset=utf-8;base64,' +
              base64.b64encode(main.encode("utf-8")).decode("ascii")
          )

          html = (
              html[:match.start()] +
              match.group(1) +
              base64.b64encode(main.encode("utf-8")).decode("ascii") +
              match.group(3) +
              html[match.end():]
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)

          print("JOGO MODIFICADO COM SUCESSO")
          print("Contador interno: 99999")
          print("Tempo das fases: 99999")
          PY

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/cargadutra/apk

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CargaDutra"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cargadutra.apk'
              compileSdk 35

              defaultConfig {
                  applicationId "com.cargadutra.apk"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Carga Dutra"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#ffffff</item>
              </style>
          </resources>
          EOF

      - name: Criar MainActivity
        run: |
          cat > app/src/main/java/com/cargadutra/apk/MainActivity.java <<'EOF'
          package com.cargadutra.apk;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.InputStream;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setSupportZoom(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          String script =
                              "(function() {" +
                              "try {" +
                              "const key='logistica_3d_android_save_v3';" +
                              "let save={};" +
                              "try { save=JSON.parse(localStorage.getItem(key)||'{}'); } catch(e) {}" +
                              "save.unlockedLevel=30;" +
                              "save.currentLevel=30;" +
                              "save.totalDeliveries=999999;" +
                              "if(!Array.isArray(save.levels)) save.levels=[];" +
                              "for(let i=1;i<=30;i++) {" +
                              "if(!save.levels[i-1]) save.levels[i-1]={};" +
                              "save.levels[i-1].levelId=i;" +
                              "save.levels[i-1].completed=true;" +
                              "save.levels[i-1].stars=3;" +
                              "save.levels[i-1].bestScore=999999;" +
                              "}" +
                              "localStorage.setItem(key,JSON.stringify(save));" +
                              "} catch(e) {}" +
                              "})();";

                          view.evaluateJavascript(script, null);
                      }
                  });

                  setContentView(web);

                  try {
                      InputStream input = getAssets().open("game.html");
                      byte[] data = new byte[input.available()];
                      input.read(data);
                      input.close();

                      String html = new String(data, "UTF-8");

                      web.loadDataWithBaseURL(
                          "https://cargadutra.netlify.app/",
                          html,
                          "text/html",
                          "UTF-8",
                          null
                      );

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gerar APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-apk-99999
          path: app/build/outputs/apk/debug/app-debug.apk
