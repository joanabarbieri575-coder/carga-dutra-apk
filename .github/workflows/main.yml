name: Gerar Carga Dutra Modificado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar jogo original
        run: |
          curl -L --fail --max-time 120 \
            "https://cargadutra.netlify.app/" \
            -o original.html

          echo "HTML baixado:"
          wc -c original.html

      - name: Modificar jogo e reconstruir módulos
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse
          import os

          HTML = "original.html"
          OUT = "dist"

          os.makedirs(OUT, exist_ok=True)

          html = open(
              HTML,
              "r",
              encoding="utf-8",
              errors="ignore"
          ).read()

          def decode_data_url(url):
              header, data = url.split(",", 1)

              data = urllib.parse.unquote(data)

              if ";base64" in header.lower():
                  raw = base64.b64decode(data)
                  return raw.decode("utf-8", errors="ignore")

              return data

          def encode_data_url(text):
              raw = text.encode("utf-8")
              encoded = base64.b64encode(raw).decode("ascii")
              return "data:text/javascript;charset=utf-8;base64," + encoded

          # Encontra o script principal
          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          principal_url = None

          for src in scripts:
              if src.startswith("data:text/javascript"):
                  principal_url = src
                  break

          if not principal_url:
              raise SystemExit(
                  "ERRO: script principal data:text/javascript não encontrado."
              )

          print("Script principal encontrado.")

          # Cache para não decodificar o mesmo módulo várias vezes
          cache = {}

          def process_module(url, depth=0):
              if url in cache:
                  return cache[url]

              js = decode_data_url(url)

              indent = "  " * depth
              print(indent + "Módulo:", len(js), "bytes")

              # Primeiro processa módulos importados.
              pattern = re.compile(
                  r'(?P<prefix>(?:from|import)\s*[\'"])(?P<url>data:text/javascript[^\'"]+)(?P<suffix>[\'"])',
                  re.I
              )

              def replace_import(match):
                  old_url = match.group("url")

                  try:
                      new_url = process_module(
                          old_url,
                          depth + 1
                      )
                      return (
                          match.group("prefix")
                          + new_url
                          + match.group("suffix")
                      )
                  except Exception as e:
                      print(
                          indent +
                          "ERRO processando módulo:",
                          e
                      )
                      raise

              js = pattern.sub(replace_import, js)

              # Modificação do TIMER REAL
              antigo = "this.state.elapsed += dt;"
              novo = "this.state.elapsed = 99999;"

              quantidade = js.count(antigo)

              if quantidade:
                  print(
                      indent +
                      "Timer encontrado:",
                      quantidade,
                      "ocorrencia(s)"
                  )

                  js = js.replace(
                      antigo,
                      novo
                  )

              # Também fazemos o HUD mostrar literalmente 99999.
              antigo_hud = "ui.hudTimer.textContent = formatTime(hud.elapsed);"
              novo_hud = "ui.hudTimer.textContent = '99999';"

              if antigo_hud in js:
                  print(
                      indent +
                      "HUD do timer encontrado."
                  )

                  js = js.replace(
                      antigo_hud,
                      novo_hud,
                      1
                  )

              new_url = encode_data_url(js)

              cache[url] = new_url

              return new_url

          # Reconstrói o principal
          principal_js = decode_data_url(principal_url)

          print("")
          print("Processando módulos do jogo...")

          # Processa os imports do principal
          pattern_principal = re.compile(
              r'(?P<prefix>(?:from|import)\s*[\'"])(?P<url>data:text/javascript[^\'"]+)(?P<suffix>[\'"])',
              re.I
          )

          def replace_principal_import(match):
              old_url = match.group("url")

              return (
                  match.group("prefix")
                  + process_module(old_url, 1)
                  + match.group("suffix")
              )

          principal_js = pattern_principal.sub(
              replace_principal_import,
              principal_js
          )

          # Garantia extra:
          # se o principal também possuir o incremento diretamente.
          if "this.state.elapsed += dt;" in principal_js:
              principal_js = principal_js.replace(
                  "this.state.elapsed += dt;",
                  "this.state.elapsed = 99999;"
              )

          # HUD literal
          if "ui.hudTimer.textContent = formatTime(hud.elapsed);" in principal_js:
              principal_js = principal_js.replace(
                  "ui.hudTimer.textContent = formatTime(hud.elapsed);",
                  "ui.hudTimer.textContent = '99999';",
                  1
              )

          # Recoloca o principal modificado no HTML.
          novo_principal = encode_data_url(principal_js)

          html_final = html.replace(
              principal_url,
              novo_principal,
              1
          )

          if html_final == html:
              raise SystemExit(
                  "ERRO: não foi possível substituir o script principal."
              )

          # Verificação final
          total_timer = (
              html_final.count(
                  "this.state.elapsed = 99999;"
              )
          )

          total_hud = (
              html_final.count(
                  "ui.hudTimer.textContent = '99999';"
              )
          )

          print("")
          print("========================================")
          print("VERIFICAÇÃO")
          print("========================================")
          print("Timer real encontrado:", total_timer)
          print("HUD 99999 encontrado:", total_hud)
          print("Módulos processados:", len(cache))

          if total_timer == 0:
              raise SystemExit(
                  "ERRO: alteração do timer não apareceu no HTML final."
              )

          if total_hud == 0:
              print(
                  "AVISO: HUD não foi encontrado; "
                  "o timer interno foi alterado mesmo assim."
              )

          # Salva versão final
          caminho_final = os.path.join(
              OUT,
              "index.html"
          )

          open(
              caminho_final,
              "w",
              encoding="utf-8"
          ).write(html_final)

          print("")
          print("Jogo modificado criado:")
          print(caminho_final)
          print("Tamanho:", len(html_final), "bytes")
          PY

      - name: Criar ZIP
        run: |
          cd dist

          zip -9 -r \
            ../carga-dutra-99999.zip \
            index.html

          cd ..

          echo "========================================"
          echo "ZIP GERADO"
          echo "========================================"

          ls -lh carga-dutra-99999.zip

      - name: Verificar ZIP
        run: |
          unzip -t carga-dutra-99999.zip

          echo ""
          echo "========================================"
          echo "BUILD CONCLUIDO"
          echo "========================================"
          echo "Arquivo: carga-dutra-99999.zip"
          echo "O ZIP contém o jogo modificado."

      - name: Disponibilizar ZIP para download
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-99999
          path: carga-dutra-99999.zip
          if-no-files-found: error
          retention-days: 7
