name: Identificar tecnologia do jogo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl

      - name: Baixar pagina principal
        shell: bash
        run: |
          curl -L --max-time 30 -s \
            "https://cargadutra.netlify.app/" \
            -o /tmp/index.html

      - name: Identificar tecnologia
        shell: bash
        run: |
          python3 <<'PY'
          import re

          html = open(
              "/tmp/index.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          texto = html.lower()

          encontrados = []

          tecnologias = {
              "React": [
                  "react",
                  "reactdom",
                  "__react",
                  "_reactroot"
              ],

              "Vite": [
                  "vite",
                  "@vite",
                  "/assets/",
                  "type=\"module\""
              ],

              "Unity": [
                  "unityloader",
                  "unityframework",
                  "unityinstance",
                  "build.loader.js",
                  "unity",
              ],

              "Godot": [
                  "godot",
                  "engine.start",
                  "godotengine"
              ],

              "Phaser": [
                  "phaser",
                  "phaser.js",
                  "phaser.min.js"
              ],

              "Three.js": [
                  "three.js",
                  "three.min.js",
                  "three.module.js",
                  "webglrenderer",
                  "three"
              ],

              "PixiJS": [
                  "pixi.js",
                  "pixi.min.js",
                  "pixijs"
              ],

              "Babylon.js": [
                  "babylon.js",
                  "babylonjs",
                  "babylon"
              ],

              "Angular": [
                  "ng-version",
                  "angular",
                  "ng-app"
              ],

              "Vue": [
                  "vue.js",
                  "vue.min.js",
                  "__vue__",
                  "data-v-"
              ],

              "Svelte": [
                  "svelte",
                  "__svelte"
              ],

              "Next.js": [
                  "__next",
                  "_next/static",
                  "next.js"
              ],

              "Electron": [
                  "electron"
              ]
          }

          for nome, termos in tecnologias.items():
              achados = []

              for termo in termos:
                  if termo.lower() in texto:
                      achados.append(termo)

              if achados:
                  encontrados.append(
                      (nome, sorted(set(achados)))
                  )

          print("")
          print("========================================")
          print("RESULTADO DA IDENTIFICACAO")
          print("========================================")
          print("")

          if encontrados:
              for nome, achados in encontrados:
                  print(f"[+] {nome}")
                  print("    Indicadores:", ", ".join(achados))
          else:
              print("[?] Nenhuma tecnologia identificada diretamente")
              print("    O jogo provavelmente carrega o motor")
              print("    dinamicamente ou usa um bundle externo.")

          print("")
          print("========================================")
          print("RECURSOS ENCONTRADOS")
          print("========================================")

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          links = re.findall(
              r'<link[^>]+href=["\']([^"\']+)["\']',
              html,
              re.I
          )

          print("")
          print("Scripts:", len(scripts))

          for src in scripts[:30]:
              print(" -", src)

          print("")
          print("Links:", len(links))

          for href in links[:30]:
              print(" -", href)

          print("")
          print("========================================")
          print("FIM DO DIAGNOSTICO")
          print("========================================")
          PY

      - name: Concluido
        run: |
          echo ""
          echo "Diagnostico concluido com sucesso."
          echo "Nenhum arquivo do jogo foi alterado."
          echo "Nenhum APK foi gerado."
