name: Diagnostico completo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Mostrar estrutura do projeto
        run: |
          echo "========================================"
          echo "ESTRUTURA DO PROJETO"
          echo "========================================"

          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            -print | sort | head -500

      - name: Procurar codigo relacionado ao tempo
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "PROCURANDO CODIGO DO CONTADOR"
          echo "========================================"

          echo ""
          echo "--- elapsed ---"
          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='package-lock.json' \
            --exclude='yarn.lock' \
            --exclude='pnpm-lock.yaml' \
            '\belapsed\b' . 2>/dev/null | head -100 || true

          echo ""
          echo "--- targetTime ---"
          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='package-lock.json' \
            --exclude='yarn.lock' \
            --exclude='pnpm-lock.yaml' \
            '\btargetTime\b' . 2>/dev/null | head -100 || true

          echo ""
          echo "--- formatTime ---"
          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='package-lock.json' \
            --exclude='yarn.lock' \
            --exclude='pnpm-lock.yaml' \
            '\bformatTime\b' . 2>/dev/null | head -100 || true

          echo ""
          echo "--- timer ---"
          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            'timer|countdown|countdownTimer|gameTimer' . 2>/dev/null | head -150 || true

          echo ""
          echo "--- tempo/time ---"
          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            'tempo|time|seconds|milliseconds|duration' . 2>/dev/null | head -200 || true

      - name: Procurar valores grandes de tempo
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "PROCURANDO VALORES RELACIONADOS AO TEMPO"
          echo "========================================"

          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            '99999|999999|60000|30000|600|300|60' . 2>/dev/null \
            | head -200 || true

      - name: Procurar contadores visuais
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "PROCURANDO TEXTO DO CONTADOR"
          echo "========================================"

          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            '00:00|0:00|remaining|remainingTime|timeLeft|timeRemaining|countdown|countDown|timerText' . 2>/dev/null \
            | head -200 || true

      - name: Identificar arquivos JavaScript
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "ARQUIVOS JAVASCRIPT/TYPESCRIPT"
          echo "========================================"

          find . -type f \
            \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.html' \) \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            -print | sort

      - name: Diagnostico final
        run: |
          echo ""
          echo "========================================"
          echo "DIAGNOSTICO TERMINADO"
          echo "========================================"
          echo ""
          echo "IMPORTANTE:"
          echo "Este workflow nao modifica o jogo."
          echo "Este workflow nao gera APK."
          echo "Este workflow nao falha se uma palavra nao for encontrada."
          echo ""
          echo "Procure nos logs pelas secoes:"
          echo "PROCURANDO CODIGO DO CONTADOR"
          echo "PROCURANDO VALORES RELACIONADOS AO TEMPO"
          echo "PROCURANDO TEXTO DO CONTADOR"
          echo ""
          echo "========================================"
