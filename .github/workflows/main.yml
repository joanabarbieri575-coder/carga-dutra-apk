name: Gerar APK Carga Dutra 99999

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. BAIXAR JOGO
      # ==========================================

      - name: Baixar jogo original
        run: |
          curl -L --fail --max-time 120 \
            "https://cargadutra.netlify.app/" \
            -o original.html

          echo "Jogo baixado:"
          wc -c original.html


      # ==========================================
      # 2. INSTALAR NODE
      # ==========================================

      - name: Configurar Java
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: 17


      # ==========================================
      # 3. MODIFICAR JOGO
      # ==========================================

      - name: Modificar timer do jogo
        run: |
          python3 <<'PY'
          import re
          import base64
          import urllib.parse
          import os

          html = open(
              "original.html",
              "r",
              encoding="utf-8",
              errors="ignore"
          ).read()

          os.makedirs("web", exist_ok=True)

          def decode_data_url(url):
              header, data = url.split(",", 1)
              data = urllib.parse.unquote(data)

              if ";base64" in header.lower():
                  return base64.b64decode(data).decode(
                      "utf-8",
                      errors="ignore"
                  )

              return data

          def encode_data_url(js):
              encoded = base64.b64encode(
                  js.encode("utf-8")
              ).decode("ascii")

              return (
                  "data:text/javascript;charset=utf-8;base64,"
                  + encoded
              )

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          principal_url = None

          for src in scripts:
              if src.startswith("data:text/javascript"):
                  principal_url = src
                  break

          if not principal_url:
              raise SystemExit(
                  "ERRO: script principal não encontrado."
              )

          print("Script principal encontrado.")

          cache = {}

          pattern = re.compile(
              r'(?P<prefix>(?:from|import)\s*[\'"])'
              r'(?P<url>data:text/javascript[^\'"]+)'
              r'(?P<suffix>[\'"])',
              re.I
          )

          alterado = False

          def process_module(url, nivel=0):

              global alterado

              if url in cache:
                  return cache[url]

              js = decode_data_url(url)

              print(
                  "  " * nivel +
                  "Módulo:",
                  len(js),
                  "bytes"
              )

              def replace_import(match):

                  old_url = match.group("url")

                  new_url = process_module(
                      old_url,
                      nivel + 1
                  )

                  return (
                      match.group("prefix")
                      + new_url
                      + match.group("suffix")
                  )

              js = pattern.sub(
                  replace_import,
                  js
              )

              # TIMER REAL
              antigo = "this.state.elapsed += dt;"
              novo = "this.state.elapsed = 99999;"

              if antigo in js:

                  print(
                      "  " * nivel +
                      ">>> TIMER ENCONTRADO"
                  )

                  js = js.replace(
                      antigo,
                      novo,
                      1
                  )

                  alterado = True

                  print(
                      "  " * nivel +
                      ">>> TIMER ALTERADO PARA 99999"
                  )

              cache[url] = encode_data_url(js)

              return cache[url]

          principal_js = decode_data_url(
              principal_url
          )

          def replace_principal(match):

              old_url = match.group("url")

              new_url = process_module(
                  old_url,
                  1
              )

              return (
                  match.group("prefix")
                  + new_url
                  + match.group("suffix")
              )

          principal_js = pattern.sub(
              replace_principal,
              principal_js
          )

          if not alterado:
              raise SystemExit(
                  "ERRO: timer não foi encontrado."
              )

          novo_principal = encode_data_url(
              principal_js
          )

          html_final = html.replace(
              principal_url,
              novo_principal,
              1
          )

          if html_final == html:
              raise SystemExit(
                  "ERRO: HTML não foi modificado."
              )

          open(
              "web/index.html",
              "w",
              encoding="utf-8"
          ).write(html_final)

          print("")
          print("================================")
          print("JOGO MODIFICADO COM SUCESSO")
          print("================================")
          print("Timer interno: 99999")
          print("Módulos:", len(cache))
          print("HTML:", len(html_final), "bytes")
          PY


      # ==========================================
      # 4. INSTALAR CAPACITOR
      # ==========================================

      - name: Criar projeto Capacitor
        run: |
          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

          npx cap init \
            "Carga Dutra" \
            "com.cargadutra.game" \
            --web-dir web


      # ==========================================
      # 5. CRIAR ANDROID
      # ==========================================

      - name: Adicionar Android
        run: |
          npx cap add android


      # ==========================================
      # 6. COPIAR JOGO PARA ANDROID
      # ==========================================

      - name: Copiar jogo modificado
        run: |
          npx cap copy android


      # ==========================================
      # 7. CONFIGURAR INTERNET
      # ==========================================

      - name: Configurar permissões Android
        run: |
          python3 <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"

          text = open(
              path,
              encoding="utf-8"
          ).read()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if permission not in text:
              text = text.replace(
                  '<manifest',
                  '<manifest'
                  + '\n    '
                  + permission,
                  1
              )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(text)

          print("Permissão INTERNET configurada.")
          PY


      # ==========================================
      # 8. CONFIGURAR JAVA
      # ==========================================

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ==========================================
      # 9. CONFIGURAR ANDROID SDK
      # ==========================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 10. COMPILAR APK
      # ==========================================

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 11. LOCALIZAR APK
      # ==========================================

      - name: Localizar APK
        run: |
          echo "APKs encontrados:"

          find android \
            -type f \
            -name "*.apk" \
            -print

          mkdir -p final

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            final/carga-dutra-99999.apk

          ls -lh final/carga-dutra-99999.apk


      # ==========================================
      # 12. DISPONIBILIZAR APK
      # ==========================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-99999-apk
          path: final/carga-dutra-99999.apk
          if-no-files-found: error
          retention-days: 7
