name: Encontrar contador

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl

      - name: Baixar pagina do jogo
        shell: bash
        run: |
          mkdir -p /tmp/jogo

          curl -L --max-time 60 \
            -s "https://cargadutra.netlify.app/" \
            -o /tmp/jogo/index.html

          echo "Pagina baixada:"
          wc -c /tmp/jogo/index.html

      - name: Encontrar scripts
        shell: bash
        run: |
          echo "========================================"
          echo "SCRIPTS ENCONTRADOS"
          echo "========================================"

          python3 <<'PY'
          import re
          from urllib.parse import urljoin

          html = open("/tmp/jogo/index.html", encoding="utf-8", errors="ignore").read()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          print("Quantidade de scripts:", len(scripts))

          with open("/tmp/jogo/scripts.txt", "w") as f:
              for src in scripts:
                  url = urljoin("https://cargadutra.netlify.app/", src)
                  print(url)
                  f.write(url + "\n")
          PY

      - name: Baixar JavaScript
        shell: bash
        run: |
          mkdir -p /tmp/jogo/js

          contador=0

          while IFS= read -r url; do
            contador=$((contador + 1))

            echo "Baixando script $contador..."

            curl -L --max-time 60 -s "$url" \
              -o "/tmp/jogo/js/script_$contador.js" \
              || true
          done < /tmp/jogo/scripts.txt

          echo ""
          echo "Scripts baixados:"
          find /tmp/jogo/js -type f -printf '%f %s bytes\n'

      - name: Procurar contador
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "POSSIVEIS TRECHOS DO CONTADOR"
          echo "========================================"

          grep -RniE \
            'elapsed|targetTime|formatTime|timeLeft|timeRemaining|remainingTime|countdown|countDown|gameTimer|timer|setInterval|setTimeout|Date\.now|performance\.now|seconds|duration' \
            /tmp/jogo/js \
            2>/dev/null \
            | head -120 \
            || true

      - name: Procurar valores de tempo
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "POSSIVEIS VALORES DO CONTADOR"
          echo "========================================"

          grep -RniE \
            '99999|999999|60000|30000|10000|5000|3000|1000|600|300|120|60' \
            /tmp/jogo/js \
            2>/dev/null \
            | head -80 \
            || true

      - name: Resumo
        run: |
          echo ""
          echo "========================================"
          echo "RESUMO"
          echo "========================================"

          echo "Arquivos JS encontrados:"
          find /tmp/jogo/js -type f | wc -l

          echo ""
          echo "Analise concluida."
          echo "Nenhum arquivo do jogo foi alterado."
          echo "Nenhum APK foi gerado."
