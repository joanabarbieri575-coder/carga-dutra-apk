name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/cargadutra/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CargaDutra"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cargadutra.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.cargadutra.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Carga Dutra"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/cargadutra/app/MainActivity.java <<'EOF'
          package com.cargadutra.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setDatabaseEnabled(true);

                  web.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          String script =
                              "(function() {" +
                              "try {" +
                              "  const key='logistica_3d_android_save_v3';" +
                              "  let save={};" +
                              "  try { save=JSON.parse(localStorage.getItem(key)||'{}'); } catch(e) {}" +
                              "  save.unlockedLevel=30;" +
                              "  save.currentLevel=30;" +
                              "  save.totalDeliveries=999999;" +
                              "  save.unlockedVehicles=save.unlockedVehicles||['standard'];" +
                              "  for(let i=1;i<=30;i++) {" +
                              "    if(!Array.isArray(save.levels)) save.levels=[];" +
                              "    if(!save.levels[i-1]) save.levels[i-1]={};" +
                              "    save.levels[i-1].levelId=i;" +
                              "    save.levels[i-1].completed=true;" +
                              "    save.levels[i-1].stars=3;" +
                              "  }" +
                              "  localStorage.setItem(key,JSON.stringify(save));" +
                              "} catch(e) {}" +
                              "})();";

                          view.evaluateJavascript(script, null);
                      }
                  });

                  web.loadUrl("https://cargadutra.netlify.app/");

                  setContentView(web);
              }
          }
          EOF

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: carga-dutra-apk-modificado
          path: app/build/outputs/apk/debug/app-debug.apk
